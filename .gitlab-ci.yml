# GitLab CI for vauchi-relay
#
# WebSocket relay server
#
# Performance optimizations:
#   - Change-based rules: Jobs run only when relevant files change
#   - Timeouts: Prevent runaway jobs from blocking runners
#   - Interruptible: Auto-cancel on new commits (via templates)
#
# GitLab Ultimate Features:
#   - SAST: Static application security testing
#   - Dependency Scanning: Cargo.lock vulnerability scanning
#   - Secret Detection: Prevent credential leaks
#   - Container Scanning: Docker image vulnerability scanning

# Shared templates + GitLab Ultimate Templates
include:
  - project: 'vauchi/scripts'
    ref: main
    file:
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/test-quality.yml'
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml

stages:
  - auto-tag
  - lint
  - test
  - mutation
  - load
  - security
  - build
  - scan

variables:
  # GitLab Ultimate Security Configuration
  SAST_EXCLUDED_PATHS: "target/"
  DS_EXCLUDED_PATHS: "target/"
  SECRET_DETECTION_EXCLUDED_PATHS: "target/"

  # Container scanning for relay image
  CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

# Override: advisory until pre-existing zero-assertion tests are remediated
quality:zero-assertions:
  allow_failure: true

# ============================================================
# Auto-Tag Stage
# ============================================================

# When Cargo.toml version is bumped and merged to main,
# automatically create a v{version} tag to trigger the release pipeline.
auto-tag:version:
  stage: auto-tag
  image: alpine:latest
  needs: []
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
  script:
    - apk add --no-cache git
    - |
      VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
      TAG="v${VERSION}"
      echo "Cargo.toml version: ${VERSION}"
      echo "Expected tag: ${TAG}"

      # Check if tag already exists
      if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
        echo "✓ Tag ${TAG} already exists — nothing to do"
        exit 0
      fi

      echo "Tag ${TAG} does not exist — creating it..."

      git config user.name "vauchi-gitlab-runner"
      git config user.email "noreply@vauchi.app"

      # Use project access token for push — CI_JOB_TOKEN cannot be used here
      # because pushes via CI_JOB_TOKEN do not trigger new pipelines, and the
      # tag push must trigger the release pipeline (build/docker stages).
      # PROJECT_ACCESS_TOKEN is set at group level in Settings > CI/CD > Variables.
      git remote set-url origin "https://vauchi-gitlab-runner:${PROJECT_ACCESS_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

      git tag -a "${TAG}" -m "Release ${TAG}"
      git push origin "${TAG}"
      echo "✓ Created and pushed tag ${TAG}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
# Lint Stage — Preflight Gate (change-based)
# ============================================================
# Cheapest checks run first. Test + security jobs wait for these
# to pass before starting (PI-13 fail-fast DAG).

lint:format:
  extends: [.rust-job, .validation-rust, .timeout-quick]
  stage: lint
  needs: []
  cache:
    policy: pull  # Read-only cache for lint
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

lint:clippy:
  extends: [.rust-job, .validation-rust, .timeout-quick]
  stage: lint
  needs: []
  cache:
    policy: pull  # Read-only cache for lint
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings

# ============================================================
# Test Stage (change-based, gated by lint)
# ============================================================

test:coverage:
  extends: [.rust-job, .validation-rust, .timeout-standard]
  stage: test
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  before_script:
    - rustup component add llvm-tools-preview
    - cargo install cargo-llvm-cov --locked || true
  script:
    - cargo llvm-cov --all-targets --lcov --output-path lcov.info
    - cargo llvm-cov report --cobertura --output-path cobertura.xml
    - cargo llvm-cov report
  coverage: '/Total:\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml
    paths:
      - lcov.info
      - cobertura.xml
    expire_in: 1 week

# ============================================================
# Mutation Stage (PI-02)
# ============================================================

# Nightly full mutation testing (scheduled pipeline)
mutation:nightly:
  extends: [.rust-job, .timeout-extended]
  stage: mutation
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - cargo binstall cargo-mutants --no-confirm 2>/dev/null || cargo install cargo-mutants --locked || true
    - cargo mutants --timeout 60 --output target/mutants
  artifacts:
    paths:
      - target/mutants/
    expire_in: 1 week

# Per-MR incremental mutation testing (advisory, runs after tests pass)
mutation:incremental:
  extends: [.rust-job, .timeout-extended]
  stage: mutation
  needs:
    - job: test:coverage
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true
  variables:
    GIT_DEPTH: "100"
  script:
    - cargo binstall cargo-mutants --no-confirm 2>/dev/null || cargo install cargo-mutants --locked || true
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=100
    - git diff "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"...HEAD > mr.diff
    - cargo mutants --in-diff mr.diff --timeout 60
  artifacts:
    paths:
      - mutants.out/
    expire_in: 1 week
    when: always

# ============================================================
# Security Stage (change-based, gated by lint, parallel with test)
# ============================================================

# GitLab security templates configuration
# Override child analyzer jobs (not parent stubs) to add tags and rules

semgrep-sast:
  tags: [docker]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Disable Gemnasium (doesn't support Cargo.lock well, use cargo-audit)
gemnasium-dependency_scanning:
  rules:
    - when: never

secret_detection:
  tags: [docker]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

container_scanning:
  stage: scan
  needs: ["build:docker"]
  tags: [docker]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# Rust-specific security (runs on dependency changes)
security:audit:
  extends: [.rust-job, .validation-deps, .timeout-quick]
  stage: security
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  cache:
    policy: pull  # Read-only cache
  script:
    - cargo install cargo-audit || true
    - cargo audit

# Full cargo-deny check: advisories, licenses, bans, sources
security:deny:
  extends: [.rust-job, .timeout-quick]
  stage: security
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  cache:
    policy: pull
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - cargo binstall cargo-deny --no-confirm 2>/dev/null || cargo install cargo-deny || true
    - cargo deny check

# ============================================================
# Load Test Stage (PI-10)
# ============================================================

# k6 WebSocket load test — runs against a local relay instance.
# Thresholds: p95 connection < 500ms, throughput > 10 msg/s.
# Manual trigger on MRs, automatic on merge to main.
load:k6:
  extends: [.rust-job, .timeout-standard]
  stage: load
  needs:
    - job: test:coverage
      optional: true
  image: grafana/k6:latest
  before_script:
    # Build relay from current source (needs Rust toolchain)
    - apt-get update -qq && apt-get install -y -qq curl gcc pkg-config libssl-dev
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - . "$HOME/.cargo/env"
    - cargo build --release
  script:
    # Start relay in background with Noise encryption disabled for load testing
    - |
      RELAY_LISTEN_ADDR=127.0.0.1:8080 \
      RELAY_REQUIRE_NOISE_ENCRYPTION=false \
      RELAY_MAX_CONNECTIONS=500 \
      ./target/release/vauchi-relay &
      RELAY_PID=$!
      sleep 2

      # Verify relay is healthy
      curl -sf http://127.0.0.1:8080/health || { echo "Relay failed to start"; kill $RELAY_PID; exit 1; }

      # Run k6 load test
      k6 run tests/load/relay-load-test.js || K6_EXIT=$?

      kill $RELAY_PID 2>/dev/null || true
      exit ${K6_EXIT:-0}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  allow_failure: true
  artifacts:
    paths:
      - summary.json
    expire_in: 1 week
    when: always

# ============================================================
# DAST Stage (PI-17) — ZAP scan for WebSocket attacks
# ============================================================

# OWASP ZAP dynamic application security testing.
# Scans relay HTTP endpoints and WebSocket for common vulnerabilities.
# Manual trigger, advisory (allow_failure).
dast:zap:
  stage: load
  needs:
    - job: test:coverage
      optional: true
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  before_script:
    # Build and start relay for scanning
    - apt-get update -qq && apt-get install -y -qq curl gcc pkg-config libssl-dev
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - . "$HOME/.cargo/env"
    - cargo build --release
  script:
    - |
      RELAY_LISTEN_ADDR=0.0.0.0:8080 \
      RELAY_REQUIRE_NOISE_ENCRYPTION=false \
      ./target/release/vauchi-relay &
      RELAY_PID=$!
      sleep 2

      # Verify relay is running
      curl -sf http://127.0.0.1:8080/health || { echo "Relay failed to start"; kill $RELAY_PID; exit 1; }

      # ZAP baseline scan against HTTP endpoints
      zap-baseline.py -t http://127.0.0.1:8080 -r zap-report.html -J zap-report.json || true

      kill $RELAY_PID 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  allow_failure: true
  artifacts:
    paths:
      - zap-report.html
      - zap-report.json
    expire_in: 1 week
    when: always

# ============================================================
# Build Stage
# ============================================================

build:release:
  extends: [.rust-job, .timeout-standard]
  stage: build
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/vauchi-relay
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

build:docker:
  extends: .timeout-standard
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
        docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
        docker push $CI_REGISTRY_IMAGE:latest
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  allow_failure: true
