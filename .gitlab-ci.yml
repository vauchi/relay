# GitLab CI for vauchi-relay
#
# WebSocket relay server
#
# Performance optimizations:
#   - Self-hosted runners: sccache, persistent caches, load-balanced
#   - Change-based rules: Jobs run only when relevant files change
#   - Timeouts: Prevent runaway jobs from blocking runners
#   - Interruptible: Auto-cancel on new commits (via templates)
#
# GitLab Ultimate Features:
#   - SAST: Static application security testing
#   - Dependency Scanning: Cargo.lock vulnerability scanning
#   - Secret Detection: Prevent credential leaks
#   - Container Scanning: Docker image vulnerability scanning

# Shared templates + GitLab Ultimate Templates
include:
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.07.6
    file:
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/security.yml'
      - '/ci-templates/coverage.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/downstream.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/release.yml'
      - '/ci-templates/test-quality.yml'
      - '/ci-templates/file-size.yml'
      - '/ci-templates/mutation.yml'
      - '/ci-templates/benchmark.yml'
      - '/ci-templates/perf.yml'
      - '/ci-templates/image-lint.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/freshness.yml'
      - '/ci-templates/github-mirror.yml'
      - '/ci-templates/verified-fetch.yml'
      - '/ci-templates/tool-install.yml'
      - '/ci-templates/security-gates.yml'
  # Container scanning is relay-specific (not included in shared security.yml)
  - template: Security/Container-Scanning.gitlab-ci.yml

stages:
  - auto-tag
  - lint
  - test
  - security
  - mutation
  - build
  - load
  - scan
  - deploy
  - verify
  - trigger


variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.07.6"
  # Container scanning for relay image
  # SAST/DS/SECRET_DETECTION excluded paths inherit from shared security.yml
  # (template defaults are more restrictive than relay's previous "target/" only)
  CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

# ============================================================
# Auto-Tag Stage
# ============================================================

# When Cargo.toml version is bumped and merged to main,
# automatically create a v{version} tag to trigger the release pipeline.
auto-tag:version:
  extends: .auto-tag

# ============================================================
# Lint Stage — Preflight Gate (change-based)
# ============================================================
# Cheapest checks run first. Test + security jobs wait for these
# to pass before starting (PI-13 fail-fast DAG).

# Blocks MRs with non-main branch refs in Cargo.toml git dependencies.
check:branch-refs:
  extends: .check-git-branch-refs

lint:images:
  extends: .image-lint

lint:format:
  extends: [.rust-runner-nocache, .lint-format, .validation-rust, .timeout-quick]
  needs: []

lint:clippy:
  extends: [.rust-runner-readonly, .lint-clippy, .validation-rust, .timeout-quick]
  needs: []

# Duplicate dependency check (advisory)
lint:duplicates:
  extends: [.rust-runner-nocache, .lint-duplicates-job, .timeout-quick]

# Unused dependency check (advisory)
lint:machete:
  extends: [.rust-runner-nocache, .lint-machete-job, .timeout-quick]

# ADR-046: HPKE-internal AEAD must be ChaCha20-Poly1305 (not AES-GCM).
# Relay is the primary HPKE consumer (OHTTP gateway path); this gate
# blocks reintroducing `hpke::Aead::Aes128Gcm` outside an inline
# `// ADR-046-EXEMPT: <reason>` allow-list. Pre-commit also runs the
# script but is bypassable (`--no-verify`); CI is the durable gate.
# Audit finding A-3 / F3 (2026-05-08).
lint:adr-046:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  before_script:
    - apk add --no-cache bash ripgrep git
    - |
      if [ ! -d ../scripts ]; then
        git clone --depth=1 --branch "${VAUCHI_SCRIPTS_REF}" https://gitlab.com/vauchi/scripts.git ../scripts
      else
        git -C ../scripts pull --ff-only 2>/dev/null || true
      fi
  script:
    - bash ../scripts/scripts/check-aead.sh .
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"

check:release-package-contract:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  script:
    - ci/tests/release-package-contract.test.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Test Stage (change-based, gated by lint)
# ============================================================

# MR: fast nextest (no coverage overhead)
test:unit:
  extends: [.rust-runner, .validation-rust, .timeout-standard]
  stage: test
  needs:
    - job: lint:format
      optional: true
  script:
    - cargo nextest run --profile ci --all-targets
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

# Exercise deploy/install.sh end-to-end: build a release binary, serve it
# from a local HTTP server, and verify the installer downloads it, checks
# the SHA-256 checksum, and installs it. Runs as root so /usr/local/bin is
# writable; service management is skipped via VAUCHI_RELAY_INSTALL_BINARY_ONLY.
test:install:
  stage: load
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/debian:bullseye-slim
  tags: [docker]
  needs:
    - job: build:release
      artifacts: true
  variables:
    VAUCHI_RELAY_INSTALL_BINARY_ONLY: "true"
  before_script:
    - apt-get update -qq && apt-get install -yqq python3 libgcc-s1 curl >/dev/null
  script:
    - test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.31"
    - |
      set -euo pipefail
      cleanup() {
        if [ -n "${RELAY_PID:-}" ]; then
          kill "${RELAY_PID}" 2>/dev/null || true
          wait "${RELAY_PID}" 2>/dev/null || true
        fi
        if [ -n "${SERVER_PID:-}" ]; then
          kill "${SERVER_PID}" 2>/dev/null || true
          wait "${SERVER_PID}" 2>/dev/null || true
        fi
      }
      trap cleanup EXIT
      release_ref="${CI_COMMIT_SHA}"
      package_dir="/tmp/pkg/packages/generic/vauchi-relay/${release_ref}"
      mkdir -p "${package_dir}"
      cp target/release/vauchi-relay "${package_dir}/vauchi-relay-linux-amd64"
      (cd "${package_dir}" && sha256sum vauchi-relay-linux-amd64 > vauchi-relay-linux-amd64.sha256)
      python3 -m http.server --directory /tmp/pkg 8765 &
      SERVER_PID=$!
      package_url="http://127.0.0.1:8765/packages/generic/vauchi-relay/${release_ref}"
      curl --fail --silent --retry 20 --retry-connrefused --retry-delay 0 \
        "${package_url}/vauchi-relay-linux-amd64.sha256" >/dev/null
      VAUCHI_RELAY_PACKAGE_BASE_URL="${package_url}" \
        bash deploy/install.sh "${release_ref}"
      kill "${SERVER_PID}"
      wait "${SERVER_PID}" 2>/dev/null || true
      SERVER_PID=
      RELAY_LISTEN_ADDR=127.0.0.1:18080 /usr/local/bin/vauchi-relay &
      RELAY_PID=$!
      curl --fail --silent --retry 20 --retry-connrefused --retry-delay 0 \
        http://127.0.0.1:18080/health >/dev/null
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "deploy/install.sh"
          - ".gitlab-ci.yml"

# Main: full coverage with llvm-cov
coverage:workspace:
  extends: [.coverage-job, .rust-runner, .timeout-long]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
  variables:
    COVERAGE_REPO_LABEL: "relay"

# Binary size tracking (main merges + release tags)
perf:binary-size:
  extends: [.binary-size-tracking-job, .rust-runner, .timeout-long]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  variables:
    BINARY_SIZE_REPO_LABEL: "relay"

# ============================================================
# Mutation Stage (uses shared template from vauchi/scripts)
# ============================================================

mutation:nightly:
  extends: [.mutation-nightly, .rust-runner]
  timeout: 12h
  variables:
    # 120s accommodates test_connect_with_tls_invalid_host (~60s TCP timeout to non-routable IP)
    MUTATION_TIMEOUT_NIGHTLY: "120"

# ============================================================
# Benchmark Stage (uses shared template from vauchi/scripts)
# ============================================================

bench:save-baseline:
  extends: [.bench-save-baseline, .linux-runner, .timeout-standard, .bench-cache]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  variables:
    BENCH_TARGETS: "--bench storage_benchmarks --bench transport_benchmarks"

bench:compare:
  extends: [.bench-compare, .linux-runner, .timeout-standard, .bench-cache]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  variables:
    BENCH_TARGETS: "--bench storage_benchmarks --bench transport_benchmarks"

# ============================================================
# Fuzz Stage (nightly, libfuzzer via cargo-fuzz)
# ============================================================

# Schedule-only libfuzzer run. Fuzz findings are noisy by nature (false-
# positives from harness shape, intentional panics, etc.); the value is
# in the corpus + a human review of crashes after the run, not in a hard
# pass/fail gate. allow_failure: true keeps the schedule pipeline green
# while still surfacing crashes via the fuzz/artifacts/ upload.
# Audited 2026-04-22 T1.2/T2.5.
fuzz:nightly:
  extends: [.rust-runner]
  timeout: 12h
  stage: mutation
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $FUZZ_ENABLED == "true"
  allow_failure: true
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  script:
    - |
      # cargo-fuzz requires nightly for -Zsanitizer=address
      rustup toolchain install nightly --profile minimal --component llvm-tools-preview 2>/dev/null || true
      command -v cargo-fuzz >/dev/null 2>&1 || cargo +nightly install cargo-fuzz --locked --force

      cd fuzz
      FUZZ_DURATION="${FUZZ_DURATION_SECS:-300}"
      FUZZ_JOBS="${FUZZ_PARALLEL_JOBS:-3}"
      REPORT_DIR="../fuzz-report"
      mkdir -p "$REPORT_DIR"

      TARGETS="fuzz_federation_message fuzz_federation_padding \
               fuzz_noise_handshake fuzz_noise_v2_detect \
               fuzz_federation_url fuzz_validate_client_id"

      TARGET_COUNT=$(echo $TARGETS | wc -w | tr -d ' ')
      echo "=== Fuzzing ${TARGET_COUNT} targets, ${FUZZ_JOBS} parallel, ${FUZZ_DURATION}s each ==="

      echo "$TARGETS" | tr ' ' '\n' | grep -v '^$' | \
        xargs -P "$FUZZ_JOBS" -I{} sh -c \
          'echo "START: {}"; cargo +nightly fuzz run {} -- -max_total_time='"$FUZZ_DURATION"' 2>&1 && echo "PASS:{}" || echo "CRASH:{}"' \
          | tee /tmp/fuzz-output.log

      FAILED=$(grep -c '^CRASH:' /tmp/fuzz-output.log || true)
      PASSED=$(grep -c '^PASS:' /tmp/fuzz-output.log || true)

      # Generate JUnit XML report for GitLab test tab
      cat > "$REPORT_DIR/fuzz-junit.xml" <<JUNIT_EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <testsuites name="fuzz:nightly" tests="${TARGET_COUNT}" failures="${FAILED}">
        <testsuite name="cargo-fuzz" tests="${TARGET_COUNT}" failures="${FAILED}">
      JUNIT_EOF
      for t in $TARGETS; do
        STATUS=$(grep -E "^(PASS|CRASH):${t}$" /tmp/fuzz-output.log | head -1 | cut -d: -f1)
        if [ "$STATUS" = "CRASH" ]; then
          echo "    <testcase name=\"${t}\" classname=\"fuzz\"><failure message=\"Crash found\"/></testcase>" >> "$REPORT_DIR/fuzz-junit.xml"
        else
          echo "    <testcase name=\"${t}\" classname=\"fuzz\"/>" >> "$REPORT_DIR/fuzz-junit.xml"
        fi
      done
      echo "  </testsuite>" >> "$REPORT_DIR/fuzz-junit.xml"
      echo "</testsuites>" >> "$REPORT_DIR/fuzz-junit.xml"

      echo "=== Fuzz Summary: Targets=${TARGET_COUNT}, Passed=$PASSED, Crashes=$FAILED ==="
      [ "$FAILED" -eq 0 ] || exit 1
  cache:
    key: fuzz-corpus-relay
    paths:
      - fuzz/corpus/
    policy: pull-push
  artifacts:
    when: always
    paths:
      - fuzz/artifacts/
      - fuzz-report/
    reports:
      junit: fuzz-report/fuzz-junit.xml
    expire_in: 1 month

# ============================================================
# Security Stage (change-based, gated by lint, parallel with test)
# ============================================================

# GitLab security templates configuration
# Override child analyzer jobs (not parent stubs) to add tags and rules

semgrep-sast:
  stage: security
  tags: !reference [.security-gate-sast-tags, tags]
  interruptible: false
  allow_failure: false
  retry: !reference [.security-gate-sast-retry, retry]
  rules: !reference [.security-gate-sast-rules, rules]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true

secret_detection:
  stage: security
  tags: !reference [.security-gate-secret-tags, tags]
  interruptible: false
  allow_failure: false
  rules: !reference [.security-gate-secret-rules, rules]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true

# Container vulnerability scan. Tag pipelines and schedule pipelines
# block on findings (release gate); main-branch pipelines are advisory
# because CVEs land continuously and we don't want every transitive
# advisory to red the merge train. Findings on main route to GitLab
# Security Dashboard.
# **Open policy question** (T1.2 audit, 2026-04-22): if nobody watches
# the dashboard, the main-branch advisory is a silent gap. Routing
# decision deferred to 2026-02-03-cicd-observability Tier 3.
container_scanning:
  stage: scan
  tags: [docker]
  interruptible: false
  needs: ["build:docker"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CONTAINER_SCANNING_ALLOW_FAILURE == "true"'
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: false

# Rust-specific security (runs on dependency changes)
security:audit:
  extends: [.rust-runner-readonly, .security-audit-job]

# Full cargo-deny check: advisories, licenses, bans, sources
security:deny:
  extends: [.rust-runner-readonly, .security-deny-job]

# Supply chain verification (cargo-vet)
# The .cargo/config.toml [patch] section records vauchi-protocol as a path dep
# in the lockfile. cargo-vet needs a git source. --regenerate-lockfile removes
# the path override and regenerates Cargo.lock so cargo-vet sees git/registry sources.
# --sync-from=77874344 pre-populates exemptions from vauchi-core so shared
# transitive deps inherit core's approved exemptions. Requires core in relay's
# CI_JOB_TOKEN allowlist. On main, remaining unvetted deps are auto-fixed and pushed.
security:vet:
  extends: [.rust-runner-readonly, .security-vet-autofix-job, .verified-fetch-script]
  variables:
    FETCH_SCRIPT_PATH: "scripts/ci/vet-autofix.sh"
    FETCH_SCRIPT_OUTPUT: "vet-autofix.sh"
    FETCH_SCRIPT_SHA256: "ee37d77f6befea5abe4899c873893b0724d1517bab7608cd080021ae809d7c30"
  script:
    - ./vet-autofix.sh --sync-from=77874344

# ============================================================
# Load Test Stage (PI-10)
# ============================================================

# k6 WebSocket load test — runs against a local relay instance.
# Thresholds: p95 connection < 500ms, throughput > 10 msg/s.
# Runs on nightly schedule and release tags (advisory).
# allow_failure: true because runner resource fluctuation makes a
# hard threshold gate too noisy; trend analysis uses summary.json.
# Audited 2026-04-22 T1.2/T2.5.
load:k6:
  extends: [.linux-runner, .timeout-standard]
  stage: load
  needs:
    - job: build:release
      artifacts: true
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.install-k6, before_script]
  script:
    # Start relay in background for load testing
    - |
      RELAY_LISTEN_ADDR=127.0.0.1:8080 \
      RELAY_MAX_CONNECTIONS=500 \
      ./target/release/vauchi-relay &
      RELAY_PID=$!

      # Wait for relay to be ready (exponential backoff: 0.2s, 0.4s, 0.8s, ... capped at 3s)
      for i in $(seq 1 20); do
        curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1 && break
        delay=$(awk "BEGIN { v = 0.2 * 2^($i-1); print (v < 3.0 ? v : 3.0) }")
        sleep "$delay"
      done
      curl -sf http://127.0.0.1:8080/health || { echo "Relay failed to start after 20 attempts"; kill $RELAY_PID; exit 1; }

      # Run k6 load test
      k6 run --summary-export=summary.json tests/load/relay-load-test.js || K6_EXIT=$?

      kill $RELAY_PID 2>/dev/null || true
      exit ${K6_EXIT:-0}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  allow_failure: true
  artifacts:
    paths:
      - summary.json
    expire_in: 1 week
    when: always

# ============================================================
# DAST Stage (PI-17) — ZAP scan for WebSocket attacks
# ============================================================

# OWASP ZAP dynamic application security testing.
# Scans relay HTTP endpoints and WebSocket for common vulnerabilities.
# Manual trigger, advisory (allow_failure).
#
# Runs the relay as a service container (its Docker image) rather than
# executing the binary inside the ZAP image, which avoids glibc version
# mismatches between the self-hosted build runner and the ZAP base image.
dast:zap:
  stage: load
  tags: [docker]
  needs:
    - job: build:docker
      artifacts: false
  image:
    name: ghcr.io/zaproxy/zaproxy:2.17.0
    entrypoint: [""]
  services:
    - name: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
      alias: relay
      variables:
        # Main listener: federation WebSocket + main-port /health probe.
        RELAY_LISTEN_ADDR: "0.0.0.0:8080"
        RELAY_MAX_CONNECTIONS: "100"
        # HTTP/REST surface: /health, /metrics, /pubkey, /build-info, /v2/*.
        # This is the real client-facing API — ZAP targets this port, not 8080,
        # so the scan actually covers the endpoints users hit.
        RELAY_METRICS_ADDR: "0.0.0.0:8081"
        RELAY_HTTP_API_ENABLED: "true"
        # CI-only: bypass the relay's TLS-proxy start guard. The service
        # container lives on GitLab's per-job Docker network, never reachable
        # outside this job's lifetime, and no client traffic flows through it.
        # DO NOT copy this line into any deploy/ manifest — production
        # deployments must set RELAY_TLS_VERIFIED=true only behind a real TLS
        # terminator (see deploy/caddy/, deploy/demo/, and relay/README.md).
        RELAY_TLS_VERIFIED: "true"
  before_script: []
  script:
    - |
      # Wait for the HTTP API listener (the port ZAP will scan).
      for i in $(seq 1 30); do
        curl -sf http://relay:8081/health >/dev/null 2>&1 && break
        sleep 1
      done
      curl -sf http://relay:8081/health || { echo "Relay HTTP API failed to start after 30 attempts"; exit 1; }

      # zap-baseline.py refuses to emit reports unless /zap/wrk exists and
      # writes them (and reads its -c config) relative to that dir — create
      # it, copy the rules config in, run, then copy the reports back to
      # CI_PROJECT_DIR so artifact upload can find them. Preserve ZAP's
      # exit code so `allow_failure: true` keeps reflecting real findings.
      mkdir -p /zap/wrk
      cp "$CI_PROJECT_DIR/.zap/baseline-rules.conf" /zap/wrk/
      set +e
      zap-baseline.py -t http://relay:8081 \
        -c baseline-rules.conf \
        -r zap-report.html -J zap-report.json
      zap_exit=$?
      set -e
      cp /zap/wrk/zap-report.html /zap/wrk/zap-report.json "$CI_PROJECT_DIR/" 2>/dev/null || true
      exit "$zap_exit"
  rules:
    # Narrowed 2026-04-22 (T3.2): was main + MR on image-input changes,
    # adding ~2:18 of blocking latency to every image-affecting MR and
    # main pipeline. The HTTP attack surface (header injection, CORS,
    # info disclosure) changes on a much slower cadence than our Rust
    # code — a nightly schedule catches regressions with no MR impact.
    # Container-level CVEs are still caught by container_scanning on
    # every main pipeline. See 2026-04-22-ci-pipeline-health-audit T3.2.
    - if: $CI_PIPELINE_SOURCE == "schedule"
  artifacts:
    paths:
      - zap-report.html
      - zap-report.json
    expire_in: 1 week
    when: always

# ============================================================
# Dev Tag Pipeline (lightweight — lint + test only)
# ============================================================
# Triggered by v0.2.3-dev.N tags. Fast feedback, no coverage/mutation/publish.

dev:verify:
  extends: [.rust-runner-nocache, .dev-verify]
  stage: lint
  needs: []

dev:lint:format:
  extends: [.rust-runner-nocache, .dev-lint-format]

dev:lint:clippy:
  extends: [.rust-runner-readonly, .dev-lint-clippy]

dev:test:
  extends: [.rust-runner, .dev-test-nextest, .timeout-standard]

# ============================================================
# RC Tag Pipeline (full quality gate — no publish/deploy)
# ============================================================
# Triggered by v0.2.3-rc.N tags. Full coverage + mutation.

rc:verify:
  extends: [.rust-runner-nocache, .rc-verify]
  stage: lint
  needs: []

rc:lint:format:
  extends: [.rust-runner-nocache, .rc-lint-format]

rc:lint:clippy:
  extends: [.rust-runner-readonly, .rc-lint-clippy]

rc:test:
  extends: [.coverage-job, .rust-runner, .timeout-long]
  needs:
    - job: rc:lint:format
      optional: true
    - job: rc:lint:clippy
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
  variables:
    COVERAGE_REPO_LABEL: "relay"

rc:mutation:
  extends: [.mutation-nightly, .rust-runner, .timeout-extended]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  variables:
    MUTATION_TIMEOUT_NIGHTLY: "60"

rc:security:audit:
  extends: [.rust-runner-readonly, .rc-security-audit]

# ============================================================
# Build Stage
# ============================================================

build:release:
  extends: .timeout-standard
  stage: build
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/rust:1.93.1-bullseye
  tags: [docker]
  needs:
    - job: test:unit
      optional: true
    - job: lint:format
      optional: true
  script:
    - cargo build --release --locked
  artifacts:
    paths:
      - target/release/vauchi-relay
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    # Run in MRs when the installer changes so test:install can exercise
    # the full download + checksum + install path.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "deploy/install.sh"
          - ".gitlab-ci.yml"

# ------------------------------------------------------------
# Container image builds are DAEMONLESS. Both CI docker runners run a
# rootless, unprivileged dockerd, so docker:dind (which needs --privileged)
# cannot start there — after the 2026-07-20 rootless reinstall it fails at
# "mount: permission denied (are you root?)". kaniko builds the images with
# no daemon; crane assembles the multi-arch manifest and promotes :latest
# without one. .kaniko-build carries the shared image + registry/proxy auth.
# ------------------------------------------------------------
.kaniko-build:
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - export BUILD_INFO="{\"sha\":\"$CI_COMMIT_SHA\",\"short_sha\":\"$CI_COMMIT_SHORT_SHA\",\"ref\":\"$CI_COMMIT_REF_NAME\",\"built\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"pipeline\":\"$CI_PIPELINE_URL\"}"
    # kaniko reads registry + dependency-proxy creds from this file. The proxy
    # auth is what lets the Dockerfile's `FROM ${HUB}/rust:...` pulls go through
    # GitLab's dependency proxy instead of anonymous (rate-limited) Docker Hub.
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<JSON
      {"auths":{
        "${CI_REGISTRY}":{"auth":"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"},
        "${CI_DEPENDENCY_PROXY_SERVER}":{"auth":"$(printf '%s:%s' "$CI_DEPENDENCY_PROXY_USER" "$CI_DEPENDENCY_PROXY_PASSWORD" | base64 | tr -d '\n')"}
      }}
      JSON

# crane (daemonless) for the manifest + :latest promotion jobs. Downloaded
# into an alpine image so we get a real shell + apk for git.
.crane-tools:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  before_script:
    - apk add --no-cache curl
    - curl -sSL "https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz" | tar -xzf - -C /usr/local/bin crane

# amd64 image build (kaniko, on allyson-docker). Pushes :$SHA; also advances
# :latest on the default branch. Release-tag :latest promotion is gated on
# highest-semver in promote:docker:latest. MR builds push only the SHA tag so
# demo/test consumers of :latest are never clobbered.
build:docker:
  extends: [.kaniko-build, .timeout-standard]
  stage: build
  tags: [docker]
  script:
    - |
      DESTS="--destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        DESTS="$DESTS --destination $CI_REGISTRY_IMAGE:latest"
      fi
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --build-arg HUB="${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}" \
        --build-arg BUILD_INFO="$BUILD_INFO" \
        $DESTS \
        --cache=true \
        --cache-repo "$CI_REGISTRY_IMAGE/cache"
  rules:
    # Main + release-tag pipelines build unconditionally — deploy:trigger
    # and downstream consumers expect a freshly-pushed image even on
    # doc-only main commits (continuity of the `latest` tag).
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    # Schedule pipelines run dast:zap (T3.2 moved it here) which needs
    # the image, so build unconditionally on schedule too.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # MR pipelines build only when changes could affect the image.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/**/*
        - Cargo.toml
        - Cargo.lock
        - Dockerfile
        - .gitlab-ci.yml

# Native arm64 image build on the shelly-ann (Raspberry Pi 5) runner — same
# daemonless kaniko path as amd64, arch-suffixed destination.
build:docker:arm64:
  extends: [.kaniko-build, .timeout-long]
  stage: build
  tags: [arm64, rpi5]
  script:
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --build-arg HUB="${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}" \
        --build-arg BUILD_INFO="$BUILD_INFO" \
        --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-arm64" \
        --cache=true \
        --cache-repo "$CI_REGISTRY_IMAGE/cache-arm64"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/**/*
        - Cargo.toml
        - Cargo.lock
        - Dockerfile
        - .gitlab-ci.yml

# Stitch amd64 (:$SHA) + arm64 (:$SHA-arm64) into a multi-arch manifest with
# crane (no daemon). :latest / :$SHA stay amd64 until arm64 deploy targets +
# container_scanning are wired to consume the manifest.
build:docker:manifest:
  extends: [.crane-tools, .timeout-quick]
  stage: build
  needs:
    - build:docker
    - build:docker:arm64
  script:
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - crane index append -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-multiarch" -m "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -m "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-arm64"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/**/*
        - Cargo.toml
        - Cargo.lock
        - Dockerfile
        - .gitlab-ci.yml

# Advance :latest to a release tag's image, but only when the tag is the
# highest semver — prevents a hotfix on an older line from regressing the
# pointer that demo/test deploys pull. Main-branch :latest is handled inline
# in build:docker; this covers only the release-tag case (crane copy, no daemon).
promote:docker:latest:
  extends: [.crane-tools, .timeout-quick]
  stage: build
  needs:
    - build:docker
  script:
    - apk add --no-cache git
    - git fetch --tags --quiet origin || true
    - |
      highest_tag=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
      if [ -z "$highest_tag" ] || [ "$CI_COMMIT_TAG" = "$highest_tag" ]; then
        crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
        crane copy "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:latest"
        echo "Promoted :latest -> $CI_COMMIT_TAG"
      else
        echo "Tag $CI_COMMIT_TAG is not the highest semver ($highest_tag) — leaving :latest."
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# Deploy Stage
# ============================================================
# Auto-triggers the centralized deploy pipeline in _private.
# The _private pipeline has manual gate jobs — click "play" there.

# Publish the release binary to the GitLab generic package registry so
# downstream E2E tests and deploy/install.sh can fetch it by SHA or tag
# instead of rebuilding from source as root.
publish:package:relay:
  stage: deploy
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs:
    - job: build:release
      artifacts: true
  variables:
    PACKAGE_NAME: "vauchi-relay"
    BINARY_NAME: "vauchi-relay-linux-amd64"
  before_script:
    - apk add --no-cache curl coreutils
  script:
    - |
      set -euo pipefail
      cp target/release/vauchi-relay "${BINARY_NAME}"
      sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256"

      upload_package() {
        local version="$1"
        local base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${version}"
        curl -fsSL --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${BINARY_NAME}" "${base}/${BINARY_NAME}"
        curl -fsSL --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${BINARY_NAME}.sha256" "${base}/${BINARY_NAME}.sha256"
        echo "✅ Published ${PACKAGE_NAME}@${version}"
      }

      upload_package "${CI_COMMIT_SHA}"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        upload_package "${CI_COMMIT_TAG}"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

deploy:trigger:
  stage: deploy
  needs:
    - job: build:docker
  trigger:
    project: vauchi/private
    branch: main
  variables:
    DEPLOY_SERVICE: relay
    DEPLOY_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Verify Stage (upstream trigger only)
# ============================================================
# Runs when core merges to main and triggers this repo via
# verify:downstream-rust. Verifies this repo builds and tests
# pass against the updated vauchi-core.

verify:upstream-compat:
  extends: [.rust-runner, .verify-on-upstream, .verify-nextest-artifacts, .timeout-standard]
  stage: verify
  needs: []
  script:
    - cargo nextest run --profile ci --all-targets

# Runs when core creates a dev/RC tag and triggers this repo.
# Verifies this repo builds and tests pass against the core tag.
verify:upstream-prerelease:
  extends: [.rust-runner, .verify-on-upstream-prerelease, .verify-nextest-artifacts, .timeout-standard]
  stage: verify
  needs: []
  script:
    - cargo nextest run --profile ci --all-targets

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages

# ============================================================
# Trigger Stage — Downstream E2E
# ============================================================

# Trigger E2E tests when relay merges to main.
# OHTTP E2E tests depend on relay — changes here need re-validation.
trigger:e2e:
  extends: .trigger-on-merge
  variables:
    DOWNSTREAM_PROJECT: vauchi/e2e

github-mirror:
  extends: .github-mirror
