# GitLab CI for vauchi-relay
#
# WebSocket relay server
#
# Performance optimizations:
#   - Self-hosted runners: sccache, persistent caches, load-balanced
#   - Change-based rules: Jobs run only when relevant files change
#   - Timeouts: Prevent runaway jobs from blocking runners
#   - Interruptible: Auto-cancel on new commits (via templates)
#
# GitLab Ultimate Features:
#   - SAST: Static application security testing
#   - Dependency Scanning: Cargo.lock vulnerability scanning
#   - Secret Detection: Prevent credential leaks
#   - Container Scanning: Docker image vulnerability scanning

# Shared templates + GitLab Ultimate Templates
include:
  - project: 'vauchi/scripts'
    ref: main
    file:
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/security.yml'
      - '/ci-templates/coverage.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/downstream.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/release.yml'
      - '/ci-templates/test-quality.yml'
      - '/ci-templates/file-size.yml'
      - '/ci-templates/mutation.yml'
      - '/ci-templates/benchmark.yml'
      - '/ci-templates/perf.yml'
      - '/ci-templates/image-lint.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/freshness.yml'
      - '/ci-templates/github-mirror.yml'
  # Container scanning is relay-specific (not included in shared security.yml)
  - template: Security/Container-Scanning.gitlab-ci.yml

stages:
  - auto-tag
  - lint
  - test
  - security
  - mutation
  - build
  - load
  - scan
  - deploy
  - verify
  - trigger


variables:
  # Container scanning for relay image
  # SAST/DS/SECRET_DETECTION excluded paths inherit from shared security.yml
  # (template defaults are more restrictive than relay's previous "target/" only)
  CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

# ============================================================
# Auto-Tag Stage
# ============================================================

# When Cargo.toml version is bumped and merged to main,
# automatically create a v{version} tag to trigger the release pipeline.
auto-tag:version:
  extends: .auto-tag

# ============================================================
# Lint Stage — Preflight Gate (change-based)
# ============================================================
# Cheapest checks run first. Test + security jobs wait for these
# to pass before starting (PI-13 fail-fast DAG).

# Blocks MRs with non-main branch refs in Cargo.toml git dependencies.
check:branch-refs:
  extends: .check-git-branch-refs

lint:images:
  extends: .image-lint

lint:format:
  extends: [.rust-runner-nocache, .lint-format, .validation-rust, .timeout-quick]
  needs: []

lint:clippy:
  extends: [.rust-runner-readonly, .lint-clippy, .validation-rust, .timeout-quick]
  needs: []

# Duplicate dependency check (advisory)
lint:duplicates:
  extends: [.rust-runner-nocache, .lint-duplicates-job, .timeout-quick]

# Unused dependency check (advisory)
lint:machete:
  extends: [.rust-runner-nocache, .lint-machete-job, .timeout-quick]

# ============================================================
# Test Stage (change-based, gated by lint)
# ============================================================

# MR: fast nextest (no coverage overhead)
test:unit:
  extends: [.rust-runner, .validation-rust, .timeout-standard]
  stage: test
  needs:
    - job: lint:format
      optional: true
  script:
    - cargo nextest run --profile ci --all-targets
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

# Main: full coverage with llvm-cov
coverage:workspace:
  extends: [.coverage-job, .rust-runner, .timeout-long]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
  variables:
    COVERAGE_REPO_LABEL: "relay"

# Binary size tracking (main merges + release tags)
perf:binary-size:
  extends: [.binary-size-tracking-job, .rust-runner, .timeout-long]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  variables:
    BINARY_SIZE_REPO_LABEL: "relay"

# ============================================================
# Mutation Stage (uses shared template from vauchi/scripts)
# ============================================================

mutation:nightly:
  extends: [.mutation-nightly, .rust-runner]
  timeout: 12h
  variables:
    # 120s accommodates test_connect_with_tls_invalid_host (~60s TCP timeout to non-routable IP)
    MUTATION_TIMEOUT_NIGHTLY: "120"

# ============================================================
# Benchmark Stage (uses shared template from vauchi/scripts)
# ============================================================

bench:save-baseline:
  extends: [.bench-save-baseline, .linux-runner, .timeout-standard, .bench-cache]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  variables:
    BENCH_TARGETS: "--bench storage_benchmarks --bench transport_benchmarks"

bench:compare:
  extends: [.bench-compare, .linux-runner, .timeout-standard, .bench-cache]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  variables:
    BENCH_TARGETS: "--bench storage_benchmarks --bench transport_benchmarks"

# ============================================================
# Fuzz Stage (nightly, libfuzzer via cargo-fuzz)
# ============================================================

# Schedule-only libfuzzer run. Fuzz findings are noisy by nature (false-
# positives from harness shape, intentional panics, etc.); the value is
# in the corpus + a human review of crashes after the run, not in a hard
# pass/fail gate. allow_failure: true keeps the schedule pipeline green
# while still surfacing crashes via the fuzz/artifacts/ upload.
# Audited 2026-04-22 T1.2/T2.5.
fuzz:nightly:
  extends: [.rust-runner]
  timeout: 12h
  stage: mutation
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $FUZZ_ENABLED == "true"
  allow_failure: true
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  script:
    - |
      # cargo-fuzz requires nightly for -Zsanitizer=address
      rustup toolchain install nightly --profile minimal --component llvm-tools-preview 2>/dev/null || true
      command -v cargo-fuzz >/dev/null 2>&1 || cargo +nightly install cargo-fuzz --locked --force

      cd fuzz
      FUZZ_DURATION="${FUZZ_DURATION_SECS:-300}"
      FUZZ_JOBS="${FUZZ_PARALLEL_JOBS:-3}"
      REPORT_DIR="../fuzz-report"
      mkdir -p "$REPORT_DIR"

      TARGETS="fuzz_federation_message fuzz_federation_padding \
               fuzz_noise_handshake fuzz_noise_v2_detect \
               fuzz_federation_url fuzz_validate_client_id"

      TARGET_COUNT=$(echo $TARGETS | wc -w | tr -d ' ')
      echo "=== Fuzzing ${TARGET_COUNT} targets, ${FUZZ_JOBS} parallel, ${FUZZ_DURATION}s each ==="

      echo "$TARGETS" | tr ' ' '\n' | grep -v '^$' | \
        xargs -P "$FUZZ_JOBS" -I{} sh -c \
          'echo "START: {}"; cargo +nightly fuzz run {} -- -max_total_time='"$FUZZ_DURATION"' 2>&1 && echo "PASS:{}" || echo "CRASH:{}"' \
          | tee /tmp/fuzz-output.log

      FAILED=$(grep -c '^CRASH:' /tmp/fuzz-output.log || true)
      PASSED=$(grep -c '^PASS:' /tmp/fuzz-output.log || true)

      # Generate JUnit XML report for GitLab test tab
      cat > "$REPORT_DIR/fuzz-junit.xml" <<JUNIT_EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <testsuites name="fuzz:nightly" tests="${TARGET_COUNT}" failures="${FAILED}">
        <testsuite name="cargo-fuzz" tests="${TARGET_COUNT}" failures="${FAILED}">
      JUNIT_EOF
      for t in $TARGETS; do
        STATUS=$(grep -E "^(PASS|CRASH):${t}$" /tmp/fuzz-output.log | head -1 | cut -d: -f1)
        if [ "$STATUS" = "CRASH" ]; then
          echo "    <testcase name=\"${t}\" classname=\"fuzz\"><failure message=\"Crash found\"/></testcase>" >> "$REPORT_DIR/fuzz-junit.xml"
        else
          echo "    <testcase name=\"${t}\" classname=\"fuzz\"/>" >> "$REPORT_DIR/fuzz-junit.xml"
        fi
      done
      echo "  </testsuite>" >> "$REPORT_DIR/fuzz-junit.xml"
      echo "</testsuites>" >> "$REPORT_DIR/fuzz-junit.xml"

      echo "=== Fuzz Summary: Targets=${TARGET_COUNT}, Passed=$PASSED, Crashes=$FAILED ==="
      [ "$FAILED" -eq 0 ] || exit 1
  cache:
    key: fuzz-corpus-relay
    paths:
      - fuzz/corpus/
    policy: pull-push
  artifacts:
    when: always
    paths:
      - fuzz/artifacts/
      - fuzz-report/
    reports:
      junit: fuzz-report/fuzz-junit.xml
    expire_in: 1 month

# ============================================================
# Security Stage (change-based, gated by lint, parallel with test)
# ============================================================

# GitLab security templates configuration
# Override child analyzer jobs (not parent stubs) to add tags and rules

semgrep-sast:
  tags: [docker]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

secret_detection:
  tags: [docker]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Container vulnerability scan. Tag pipelines and schedule pipelines
# block on findings (release gate); main-branch pipelines are advisory
# because CVEs land continuously and we don't want every transitive
# advisory to red the merge train. Findings on main route to GitLab
# Security Dashboard.
# **Open policy question** (T1.2 audit, 2026-04-22): if nobody watches
# the dashboard, the main-branch advisory is a silent gap. Routing
# decision deferred to 2026-02-03-cicd-observability Tier 3.
container_scanning:
  stage: scan
  needs: ["build:docker"]
  tags: [docker]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true

# Rust-specific security (runs on dependency changes)
security:audit:
  extends: [.rust-runner-readonly, .security-audit-job]

# Full cargo-deny check: advisories, licenses, bans, sources
security:deny:
  extends: [.rust-runner-readonly, .security-deny-job]

# Supply chain verification (cargo-vet)
# The .cargo/config.toml [patch] section records vauchi-protocol as a path dep
# in the lockfile. cargo-vet needs a git source. --regenerate-lockfile removes
# the path override and regenerates Cargo.lock so cargo-vet sees git/registry sources.
# --sync-from=77874344 pre-populates exemptions from vauchi-core so shared
# transitive deps inherit core's approved exemptions. Requires core in relay's
# CI_JOB_TOKEN allowlist. On main, remaining unvetted deps are auto-fixed and pushed.
security:vet:
  extends: [.rust-runner-readonly, .security-vet-autofix-job]
  script:
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/77957857/repository/files/scripts%2Fci%2Fvet-autofix.sh/raw?ref=main" \
        -o vet-autofix.sh
      chmod +x vet-autofix.sh
    - ./vet-autofix.sh --regenerate-lockfile --sync-from=77874344

# ============================================================
# Load Test Stage (PI-10)
# ============================================================

# k6 WebSocket load test — runs against a local relay instance.
# Thresholds: p95 connection < 500ms, throughput > 10 msg/s.
# Runs on nightly schedule and release tags (advisory).
# allow_failure: true because runner resource fluctuation makes a
# hard threshold gate too noisy; trend analysis uses summary.json.
# Audited 2026-04-22 T1.2/T2.5.
load:k6:
  extends: [.linux-runner, .timeout-standard]
  stage: load
  needs:
    - job: build:release
      artifacts: true
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v k6 >/dev/null 2>&1 || { curl -fsSL https://github.com/grafana/k6/releases/download/v0.56.0/k6-v0.56.0-linux-amd64.tar.gz | tar xz --strip-components=1 -C /usr/local/bin k6-v0.56.0-linux-amd64/k6; }
  script:
    # Start relay in background for load testing
    - |
      RELAY_LISTEN_ADDR=127.0.0.1:8080 \
      RELAY_MAX_CONNECTIONS=500 \
      ./target/release/vauchi-relay &
      RELAY_PID=$!

      # Wait for relay to be ready (exponential backoff: 0.2s, 0.4s, 0.8s, ... capped at 3s)
      for i in $(seq 1 20); do
        curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1 && break
        delay=$(awk "BEGIN { v = 0.2 * 2^($i-1); print (v < 3.0 ? v : 3.0) }")
        sleep "$delay"
      done
      curl -sf http://127.0.0.1:8080/health || { echo "Relay failed to start after 20 attempts"; kill $RELAY_PID; exit 1; }

      # Run k6 load test
      k6 run --summary-export=summary.json tests/load/relay-load-test.js || K6_EXIT=$?

      kill $RELAY_PID 2>/dev/null || true
      exit ${K6_EXIT:-0}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  allow_failure: true
  artifacts:
    paths:
      - summary.json
    expire_in: 1 week
    when: always

# ============================================================
# DAST Stage (PI-17) — ZAP scan for WebSocket attacks
# ============================================================

# OWASP ZAP dynamic application security testing.
# Scans relay HTTP endpoints and WebSocket for common vulnerabilities.
# Manual trigger, advisory (allow_failure).
#
# Runs the relay as a service container (its Docker image) rather than
# executing the binary inside the ZAP image, which avoids glibc version
# mismatches between the self-hosted build runner and the ZAP base image.
dast:zap:
  stage: load
  tags: [docker]
  needs:
    - job: build:docker
      artifacts: false
  image:
    name: ghcr.io/zaproxy/zaproxy:2.17.0
    entrypoint: [""]
  services:
    - name: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
      alias: relay
      variables:
        # Main listener: federation WebSocket + main-port /health probe.
        RELAY_LISTEN_ADDR: "0.0.0.0:8080"
        RELAY_MAX_CONNECTIONS: "100"
        # HTTP/REST surface: /health, /metrics, /pubkey, /build-info, /v2/*.
        # This is the real client-facing API — ZAP targets this port, not 8080,
        # so the scan actually covers the endpoints users hit.
        RELAY_METRICS_ADDR: "0.0.0.0:8081"
        RELAY_HTTP_API_ENABLED: "true"
        # CI-only: bypass the relay's TLS-proxy start guard. The service
        # container lives on GitLab's per-job Docker network, never reachable
        # outside this job's lifetime, and no client traffic flows through it.
        # DO NOT copy this line into any deploy/ manifest — production
        # deployments must set RELAY_TLS_VERIFIED=true only behind a real TLS
        # terminator (see deploy/caddy/, deploy/demo/, and relay/README.md).
        RELAY_TLS_VERIFIED: "true"
  before_script: []
  script:
    - |
      # Wait for the HTTP API listener (the port ZAP will scan).
      for i in $(seq 1 30); do
        curl -sf http://relay:8081/health >/dev/null 2>&1 && break
        sleep 1
      done
      curl -sf http://relay:8081/health || { echo "Relay HTTP API failed to start after 30 attempts"; exit 1; }

      # zap-baseline.py refuses to emit reports unless /zap/wrk exists and
      # writes them (and reads its -c config) relative to that dir — create
      # it, copy the rules config in, run, then copy the reports back to
      # CI_PROJECT_DIR so artifact upload can find them. Preserve ZAP's
      # exit code so `allow_failure: true` keeps reflecting real findings.
      mkdir -p /zap/wrk
      cp "$CI_PROJECT_DIR/.zap/baseline-rules.conf" /zap/wrk/
      set +e
      zap-baseline.py -t http://relay:8081 \
        -c baseline-rules.conf \
        -r zap-report.html -J zap-report.json
      zap_exit=$?
      set -e
      cp /zap/wrk/zap-report.html /zap/wrk/zap-report.json "$CI_PROJECT_DIR/" 2>/dev/null || true
      exit "$zap_exit"
  rules:
    # Mirror build:docker's coverage so `needs: build:docker` always
    # resolves. On main we additionally scope to image-relevant changes
    # — doc-only commits can't produce a scan result different from the
    # previous main pipeline, so running again is waste.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: &relay-image-inputs
        - src/**/*
        - Cargo.toml
        - Cargo.lock
        - Dockerfile
        - .gitlab-ci.yml
        - .zap/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *relay-image-inputs
  artifacts:
    paths:
      - zap-report.html
      - zap-report.json
    expire_in: 1 week
    when: always

# ============================================================
# Dev Tag Pipeline (lightweight — lint + test only)
# ============================================================
# Triggered by v0.2.3-dev.N tags. Fast feedback, no coverage/mutation/publish.

dev:verify:
  extends: [.rust-runner-nocache, .dev-verify]
  stage: lint
  needs: []

dev:lint:format:
  extends: [.rust-runner-nocache, .dev-lint-format]

dev:lint:clippy:
  extends: [.rust-runner-readonly, .dev-lint-clippy]

dev:test:
  extends: [.rust-runner, .dev-test-nextest, .timeout-standard]

# ============================================================
# RC Tag Pipeline (full quality gate — no publish/deploy)
# ============================================================
# Triggered by v0.2.3-rc.N tags. Full coverage + mutation.

rc:verify:
  extends: [.rust-runner-nocache, .rc-verify]
  stage: lint
  needs: []

rc:lint:format:
  extends: [.rust-runner-nocache, .rc-lint-format]

rc:lint:clippy:
  extends: [.rust-runner-readonly, .rc-lint-clippy]

rc:test:
  extends: [.coverage-job, .rust-runner, .timeout-long]
  needs:
    - job: rc:lint:format
      optional: true
    - job: rc:lint:clippy
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
  variables:
    COVERAGE_REPO_LABEL: "relay"

rc:mutation:
  extends: [.mutation-nightly, .rust-runner, .timeout-extended]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  variables:
    MUTATION_TIMEOUT_NIGHTLY: "60"

rc:security:audit:
  extends: [.rust-runner-readonly, .rc-security-audit]

# ============================================================
# Build Stage
# ============================================================

build:release:
  extends: [.linux-runner, .timeout-standard]
  stage: build
  needs:
    - job: test:unit
      optional: true
    - job: lint:format
      optional: true
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/vauchi-relay
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

build:docker:
  extends: .timeout-standard
  stage: build
  tags: [docker]
  image: docker:27
  services:
    - docker:dind
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
      fi
    # Generate build metadata for deploy traceability
    - BUILD_INFO="{\"sha\":\"$CI_COMMIT_SHA\",\"short_sha\":\"$CI_COMMIT_SHORT_SHA\",\"ref\":\"$CI_COMMIT_REF_NAME\",\"built\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"pipeline\":\"$CI_PIPELINE_URL\"}"
    # --pull forces a fresh base-image fetch on every build so upstream
    # security patches in distroless/debian land in the next image.
    # --cache-from still reuses our own intermediate layers for speed.
    - docker build --pull --build-arg BUILD_INFO="$BUILD_INFO" --cache-from $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
        # :latest is consumed by deploy/{demo,test,docker-compose.ohttp}.yml —
        # only advance it when the pipeline represents a production-ready
        # artifact (main branch, or a release tag). MR-pipeline builds push
        # only the SHA tag; they must not overwrite what demo consumers pull.
        promote_latest=false
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          promote_latest=true
        elif [ -n "$CI_COMMIT_TAG" ]; then
          # Only the highest existing semver tag advances :latest — prevents
          # a hotfix tag on an older release line (e.g. v0.17.5 landing after
          # v0.19.33 has shipped) from regressing the pointer consumed by
          # demo/test deploys. Fetch all tags (shallow clones may omit them),
          # match the strict vMAJOR.MINOR.PATCH form, sort by version.
          command -v git >/dev/null 2>&1 || apk add --no-cache git >/dev/null 2>&1 || true
          git fetch --tags --quiet origin 2>/dev/null || true
          highest_tag=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$highest_tag" ]; then
            echo "No existing semver tags found — treating $CI_COMMIT_TAG as the highest."
            promote_latest=true
          elif [ "$CI_COMMIT_TAG" = "$highest_tag" ]; then
            promote_latest=true
          else
            echo "Skipping :latest push — tag $CI_COMMIT_TAG is not the highest semver (current highest: $highest_tag)."
          fi
        else
          echo "Skipping :latest push — pipeline context ($CI_PIPELINE_SOURCE) is not main/tag."
        fi
        if [ "$promote_latest" = "true" ]; then
          docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
          docker push $CI_REGISTRY_IMAGE:latest
        fi
      fi
  rules:
    # Main + release-tag pipelines build unconditionally — deploy:trigger
    # and downstream consumers expect a freshly-pushed image even on
    # doc-only main commits (continuity of the `latest` tag).
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    # MR pipelines build only when changes could affect the image. This
    # keeps dast:zap runnable on MRs (it `needs: build:docker`) without
    # burning docker:dind minutes on doc-only or test-only diffs.
    # `changes:` list mirrors the anchor from dast:zap above.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *relay-image-inputs

# ============================================================
# Deploy Stage
# ============================================================
# Auto-triggers the centralized deploy pipeline in _private.
# The _private pipeline has manual gate jobs — click "play" there.

deploy:trigger:
  stage: deploy
  needs:
    - job: build:docker
  trigger:
    project: vauchi/private
    branch: main
  variables:
    DEPLOY_SERVICE: relay
    DEPLOY_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Verify Stage (upstream trigger only)
# ============================================================
# Runs when core merges to main and triggers this repo via
# verify:downstream-rust. Verifies this repo builds and tests
# pass against the updated vauchi-core.

verify:upstream-compat:
  extends: [.rust-runner, .verify-on-upstream, .verify-nextest-artifacts, .timeout-standard]
  stage: verify
  needs: []
  script:
    - cargo nextest run --profile ci --all-targets

# Runs when core creates a dev/RC tag and triggers this repo.
# Verifies this repo builds and tests pass against the core tag.
verify:upstream-prerelease:
  extends: [.rust-runner, .verify-on-upstream-prerelease, .verify-nextest-artifacts, .timeout-standard]
  stage: verify
  needs: []
  script:
    - cargo nextest run --profile ci --all-targets

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages

# ============================================================
# Trigger Stage — Downstream E2E
# ============================================================

# Trigger E2E tests when relay merges to main.
# OHTTP E2E tests depend on relay — changes here need re-validation.
trigger:e2e:
  extends: .trigger-on-merge
  variables:
    DOWNSTREAM_PROJECT: vauchi/e2e

github-mirror:
  extends: .github-mirror
