# GitLab CI for vauchi-relay
#
# WebSocket relay server
#
# Performance optimizations:
#   - Self-hosted runners: sccache, persistent caches, load-balanced
#   - Change-based rules: Jobs run only when relevant files change
#   - Timeouts: Prevent runaway jobs from blocking runners
#   - Interruptible: Auto-cancel on new commits (via templates)
#
# GitLab Ultimate Features:
#   - SAST: Static application security testing
#   - Dependency Scanning: Cargo.lock vulnerability scanning
#   - Secret Detection: Prevent credential leaks
#   - Container Scanning: Docker image vulnerability scanning

# Shared templates + GitLab Ultimate Templates
include:
  - project: 'vauchi/scripts'
    ref: main
    file:
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/security.yml'
      - '/ci-templates/coverage.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/downstream.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/release.yml'
      - '/ci-templates/test-quality.yml'
      - '/ci-templates/file-size.yml'
      - '/ci-templates/mutation.yml'
      - '/ci-templates/benchmark.yml'
      - '/ci-templates/perf.yml'
      - '/ci-templates/badges.yml'
  # Container scanning is relay-specific (not included in shared security.yml)
  - template: Security/Container-Scanning.gitlab-ci.yml

stages:
  - auto-tag
  - lint
  - test
  - security
  - mutation
  - build
  - load
  - scan
  - deploy
  - verify


variables:
  # Container scanning for relay image
  # SAST/DS/SECRET_DETECTION excluded paths inherit from shared security.yml
  # (template defaults are more restrictive than relay's previous "target/" only)
  CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

# ============================================================
# Auto-Tag Stage
# ============================================================

# When Cargo.toml version is bumped and merged to main,
# automatically create a v{version} tag to trigger the release pipeline.
auto-tag:version:
  extends: .auto-tag

# ============================================================
# Lint Stage — Preflight Gate (change-based)
# ============================================================
# Cheapest checks run first. Test + security jobs wait for these
# to pass before starting (PI-13 fail-fast DAG).

lint:format:
  extends: [.rust-runner-nocache, .lint-format, .validation-rust, .timeout-quick]
  needs: []

lint:clippy:
  extends: [.rust-runner-readonly, .lint-clippy, .validation-rust, .timeout-quick]
  needs: []

# Duplicate dependency check (advisory)
lint:duplicates:
  extends: [.rust-runner-nocache, .lint-duplicates-job, .timeout-quick]

# Unused dependency check (advisory)
lint:machete:
  extends: [.rust-runner-nocache, .lint-machete-job, .timeout-quick]

# ============================================================
# Test Stage (change-based, gated by lint)
# ============================================================

# MR: fast nextest (no coverage overhead)
test:
  extends: [.rust-runner, .validation-rust, .timeout-standard]
  stage: test
  needs:
    - job: lint:format
      optional: true
  script:
    - cargo nextest run --profile ci --all-targets
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

# Main: full coverage with llvm-cov
coverage:
  extends: [.coverage-job, .rust-runner, .timeout-long]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
  variables:
    COVERAGE_REPO_LABEL: "relay"

# Binary size tracking (main merges + release tags)
perf:binary-size:
  extends: [.binary-size-tracking-job, .rust-runner, .timeout-long]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  variables:
    BINARY_SIZE_REPO_LABEL: "relay"

# ============================================================
# Mutation Stage (uses shared template from vauchi/scripts)
# ============================================================

mutation:nightly:
  extends: [.mutation-nightly, .rust-runner, .timeout-extended]
  variables:
    MUTATION_TIMEOUT_NIGHTLY: "60"

# ============================================================
# Benchmark Stage (uses shared template from vauchi/scripts)
# ============================================================

bench:save-baseline:
  extends: [.bench-save-baseline, .linux-runner, .timeout-standard, .bench-cache]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  variables:
    BENCH_TARGETS: "--bench storage_benchmarks --bench transport_benchmarks"

bench:compare:
  extends: [.bench-compare, .linux-runner, .timeout-standard, .bench-cache]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  variables:
    BENCH_TARGETS: "--bench storage_benchmarks --bench transport_benchmarks"

# ============================================================
# Fuzz Stage (nightly, libfuzzer via cargo-fuzz)
# ============================================================

fuzz:nightly:
  extends: [.rust-runner, .timeout-extended]
  stage: mutation
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $FUZZ_ENABLED == "true"
  allow_failure: true
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  script:
    - |
      command -v cargo-fuzz >/dev/null 2>&1 || cargo install cargo-fuzz --locked
      cd fuzz
      FUZZ_DURATION="${FUZZ_DURATION_SECS:-300}"
      FUZZ_JOBS="${FUZZ_PARALLEL_JOBS:-3}"

      TARGETS="fuzz_federation_message fuzz_federation_padding \
               fuzz_noise_handshake fuzz_noise_v2_detect \
               fuzz_federation_url fuzz_validate_client_id"

      echo "=== Fuzzing $(echo $TARGETS | wc -w) targets, ${FUZZ_JOBS} parallel, ${FUZZ_DURATION}s each ==="

      echo "$TARGETS" | tr ' ' '\n' | grep -v '^$' | \
        xargs -P "$FUZZ_JOBS" -I{} sh -c \
          'echo "START: {}"; cargo fuzz run {} -- -max_total_time='"$FUZZ_DURATION"' 2>&1 || echo "CRASH:{}"' \
          | tee /tmp/fuzz-output.log

      FAILED=$(grep -c '^CRASH:' /tmp/fuzz-output.log || true)
      echo "=== Fuzz Summary: Targets=6, Crashes=$FAILED ==="
      [ "$FAILED" -eq 0 ] || exit 1
  cache:
    key: fuzz-corpus-relay
    paths:
      - fuzz/corpus/
    policy: pull-push
  artifacts:
    paths:
      - fuzz/artifacts/
    expire_in: 1 month
    when: on_failure

# ============================================================
# Security Stage (change-based, gated by lint, parallel with test)
# ============================================================

# GitLab security templates configuration
# Override child analyzer jobs (not parent stubs) to add tags and rules

semgrep-sast:
  tags: [docker]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

secret_detection:
  tags: [docker]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

container_scanning:
  stage: scan
  needs: ["build:docker"]
  tags: [docker]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Rust-specific security (runs on dependency changes)
security:audit:
  extends: [.rust-runner-readonly, .security-audit-job]

# Full cargo-deny check: advisories, licenses, bans, sources
security:deny:
  extends: [.rust-runner-readonly, .security-deny-job]

# Supply chain verification (cargo-vet)
security:vet:
  extends: [.rust-runner-readonly, .security-vet-job]

# ============================================================
# Load Test Stage (PI-10)
# ============================================================

# Shared service definition for Docker relay (used by multiple jobs)
.relay-docker-service:
  services:
    - name: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
      alias: relay
      variables:
        RELAY_LISTEN_ADDR: "0.0.0.0:8080"
        RELAY_TLS_VERIFIED: "true"
        RELAY_REQUIRE_NOISE_ENCRYPTION: "false"
        RELAY_STORAGE_BACKEND: "sqlite"
        RELAY_DATA_DIR: "/data"

.wait-for-relay: &wait-for-relay
  - |
    for i in $(seq 1 30); do
      curl -sf http://relay:8080/health && break
      sleep 0.5
    done
    curl -sf http://relay:8080/health || { echo "Relay service failed to start"; exit 1; }

# Lightweight WebSocket smoke test against the Docker image.
# Verifies the musl static binary handles real WebSocket connections.
smoke:websocket:
  stage: load
  tags: [docker]
  needs: ["build:docker"]
  extends: .relay-docker-service
  image: alpine:3.21
  before_script:
    - apk add --no-cache curl python3
  script:
    - *wait-for-relay
    - |
      # 1. Health endpoint
      curl -sf http://relay:8080/health | grep -q '"healthy"'
      echo "PASS: health endpoint"

      # 2. WebSocket upgrade — verify server accepts upgrade and responds
      #    with 101 Switching Protocols (requires proper WS headers)
      HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
        -H "Upgrade: websocket" \
        -H "Connection: Upgrade" \
        -H "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" \
        -H "Sec-WebSocket-Version: 13" \
        http://relay:8080/)
      if [ "$HTTP_CODE" = "101" ]; then
        echo "PASS: WebSocket upgrade accepted (101)"
      else
        echo "FAIL: Expected 101, got $HTTP_CODE"
        exit 1
      fi

      # 3. WebSocket handshake + message exchange using python3
      #    Protocol: binary WS frame, 4-byte BE length prefix, JSON MessageEnvelope
      python3 -c "
      import socket, base64, struct, os, json, time

      # Connect with timeout on all operations
      s = socket.create_connection(('relay', 8080), timeout=5)
      s.settimeout(5)

      # WebSocket upgrade handshake
      key = base64.b64encode(os.urandom(16)).decode()
      s.sendall(f'GET / HTTP/1.1\r\nHost: relay:8080\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n'.encode())

      resp = s.recv(4096).decode()
      assert '101' in resp, f'Expected 101, got: {resp[:80]}'

      # Build v1 Handshake as a MessageEnvelope with length-prefixed binary frame
      client_id = 'a' * 64
      envelope = json.dumps({
          'version': 1,
          'message_id': 'smoke-test-1',
          'timestamp': int(time.time()),
          'payload': {'type': 'Handshake', 'client_id': client_id}
      }).encode()

      # Length-prefix: 4-byte big-endian length + JSON bytes
      payload = struct.pack('>I', len(envelope)) + envelope

      # Send as WebSocket binary frame (opcode 0x82), masked per RFC 6455
      mask = os.urandom(4)
      frame = bytearray([0x82])  # FIN + binary
      length = len(payload)
      if length < 126:
          frame.append(0x80 | length)  # MASK bit + length
      elif length < 65536:
          frame.append(0x80 | 126)
          frame.extend(struct.pack('>H', length))
      frame.extend(mask)
      frame.extend(bytes(b ^ mask[i % 4] for i, b in enumerate(payload)))
      s.sendall(bytes(frame))

      # Read server response (HandshakeAck)
      data = s.recv(4096)
      assert len(data) > 2, f'Expected server response, got {len(data)} bytes'
      print(f'PASS: WebSocket handshake + message exchange ({len(data)} bytes received)')
      s.close()
      "
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      needs: ["build:docker"]

# k6 WebSocket load test against the Docker relay image.
# Thresholds: p95 connection < 500ms, throughput > 10 msg/s.
load:k6:
  stage: load
  tags: [docker]
  needs: ["build:docker"]
  extends: .relay-docker-service
  image:
    name: grafana/k6:latest
    entrypoint: [""]
  script:
    - |
      # Wait for relay service
      for i in $(seq 1 30); do
        wget -qO- http://relay:8080/health && break
        sleep 0.5
      done
      wget -qO- http://relay:8080/health || { echo "Relay service failed to start"; exit 1; }
    - k6 run --env RELAY_URL=ws://relay:8080 --summary-export=summary.json tests/load/relay-load-test.js
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "schedule"
  artifacts:
    paths:
      - summary.json
    expire_in: 1 week
    when: always

# ============================================================
# DAST Stage (PI-17) — ZAP scan for WebSocket attacks
# ============================================================

# OWASP ZAP dynamic application security testing.
# Scans relay HTTP endpoints for common vulnerabilities.
dast:zap:
  stage: load
  tags: [docker]
  needs: ["build:docker"]
  extends: .relay-docker-service
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  before_script: []
  script:
    - *wait-for-relay
    - mkdir -p /zap/wrk
    - zap-baseline.py -t http://relay:8080 -r zap-report.html -J zap-report.json
    - cp /zap/wrk/zap-report.html /zap/wrk/zap-report.json . 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  allow_failure: true
  artifacts:
    paths:
      - zap-report.html
      - zap-report.json
    expire_in: 1 week
    when: always

# ============================================================
# Dev Tag Pipeline (lightweight — lint + test only)
# ============================================================
# Triggered by v0.2.3-dev.N tags. Fast feedback, no coverage/mutation/publish.

dev:verify:
  extends: [.rust-runner-nocache, .dev-verify]
  stage: lint
  needs: []

dev:lint:format:
  extends: [.rust-runner-nocache, .dev-lint-format]

dev:lint:clippy:
  extends: [.rust-runner-readonly, .dev-lint-clippy]

dev:test:
  extends: [.rust-runner, .dev-test-nextest, .timeout-standard]

# ============================================================
# RC Tag Pipeline (full quality gate — no publish/deploy)
# ============================================================
# Triggered by v0.2.3-rc.N tags. Full coverage + mutation.

rc:verify:
  extends: [.rust-runner-nocache, .rc-verify]
  stage: lint
  needs: []

rc:lint:format:
  extends: [.rust-runner-nocache, .rc-lint-format]

rc:lint:clippy:
  extends: [.rust-runner-readonly, .rc-lint-clippy]

rc:test:
  extends: [.coverage-job, .rust-runner, .timeout-long]
  needs:
    - job: rc:lint:format
      optional: true
    - job: rc:lint:clippy
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
  variables:
    COVERAGE_REPO_LABEL: "relay"

rc:mutation:
  extends: [.mutation-nightly, .rust-runner, .timeout-extended]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  variables:
    MUTATION_TIMEOUT_NIGHTLY: "60"

rc:security:audit:
  extends: [.rust-runner-readonly, .rc-security-audit]

# ============================================================
# Build Stage
# ============================================================

build:release:
  extends: [.linux-runner, .timeout-standard]
  stage: build
  needs:
    - job: test
      optional: true
    - job: lint:format
      optional: true
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/vauchi-relay
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

build:docker:
  extends: .timeout-standard
  stage: build
  tags: [docker]
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
      fi
    # Generate build metadata for deploy traceability
    - BUILD_INFO="{\"sha\":\"$CI_COMMIT_SHA\",\"short_sha\":\"$CI_COMMIT_SHORT_SHA\",\"ref\":\"$CI_COMMIT_REF_NAME\",\"built\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"pipeline\":\"$CI_PIPELINE_URL\"}"
    - docker build --build-arg BUILD_INFO="$BUILD_INFO" --cache-from $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
        docker push $CI_REGISTRY_IMAGE:latest
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# ============================================================
# Deploy Stage
# ============================================================
# Auto-triggers the centralized deploy pipeline in _private.
# The _private pipeline has manual gate jobs — click "play" there.

deploy:trigger:
  stage: deploy
  needs:
    - job: build:docker
  trigger:
    project: vauchi/private
    branch: main
  variables:
    DEPLOY_SERVICE: relay
    DEPLOY_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Verify Stage (upstream trigger only)
# ============================================================
# Runs when core merges to main and triggers this repo via
# verify:downstream-rust. Verifies this repo builds and tests
# pass against the updated vauchi-core.

verify:upstream-compat:
  extends: [.rust-runner, .verify-on-upstream, .verify-nextest-artifacts, .timeout-standard]
  stage: verify
  needs: []
  script:
    - cargo nextest run --profile ci --all-targets

# Runs when core creates a dev/RC tag and triggers this repo.
# Verifies this repo builds and tests pass against the core tag.
verify:upstream-prerelease:
  extends: [.rust-runner, .verify-on-upstream-prerelease, .verify-nextest-artifacts, .timeout-standard]
  stage: verify
  needs: []
  script:
    - cargo nextest run --profile ci --all-targets

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages
