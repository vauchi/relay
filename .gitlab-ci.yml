  artifacts:
    paths:
      - mutants.out/
    expire_in: 1 week
    when: always

# ============================================================
# Security Stage (change-based, gated by lint, parallel with test)
# ============================================================

# GitLab security templates configuration
# Override child analyzer jobs (not parent stubs) to add tags and rules

semgrep-sast:
  tags: [docker]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Disable Gemnasium (doesn't support Cargo.lock well, use cargo-audit)
gemnasium-dependency_scanning:
  rules:
    - when: never

secret_detection:
  tags: [docker]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

container_scanning:
  stage: scan
  needs: ["build:docker"]
  tags: [docker]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# Rust-specific security (runs on dependency changes)
security:audit:
  extends: [.rust-runner-readonly, .validation-deps, .timeout-quick]
  stage: security
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  script:
    - cargo audit

# Full cargo-deny check: advisories, licenses, bans, sources
security:deny:
  extends: [.rust-runner-readonly, .timeout-quick]
  stage: security
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - cargo deny check

# ============================================================
# Load Test Stage (PI-10)
# ============================================================

# k6 WebSocket load test — runs against a local relay instance.
# Thresholds: p95 connection < 500ms, throughput > 10 msg/s.
# Manual trigger on MRs, automatic on merge to main.
load:k6:
  extends: .timeout-standard
  stage: load
  needs:
    - job: build:release
      artifacts: true
      optional: true
    - job: test
      optional: true
  tags: [docker]
  image: grafana/k6:latest
  before_script:
    - |
      # Use prebuilt binary from build:release if available, otherwise compile
      if [ ! -f "target/release/vauchi-relay" ]; then
        apt-get update -qq && apt-get install -y -qq curl gcc pkg-config libssl-dev
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        . "$HOME/.cargo/env"
        cargo build --release
      fi
  script:
    # Start relay in background with Noise encryption disabled for load testing
    - |
      RELAY_LISTEN_ADDR=127.0.0.1:8080 \
      RELAY_REQUIRE_NOISE_ENCRYPTION=false \
      RELAY_MAX_CONNECTIONS=500 \
      ./target/release/vauchi-relay &
      RELAY_PID=$!

      # Wait for relay to be ready (poll health endpoint)
      for i in $(seq 1 30); do
        curl -sf http://127.0.0.1:8080/health && break
        sleep 0.5
      done

      # Verify relay is healthy
      curl -sf http://127.0.0.1:8080/health || { echo "Relay failed to start"; kill $RELAY_PID; exit 1; }

      # Run k6 load test
      k6 run tests/load/relay-load-test.js || K6_EXIT=$?

      kill $RELAY_PID 2>/dev/null || true
      exit ${K6_EXIT:-0}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  allow_failure: true
  artifacts:
    paths:
      - summary.json
    expire_in: 1 week
    when: always

# ============================================================
# DAST Stage (PI-17) — ZAP scan for WebSocket attacks
# ============================================================

# OWASP ZAP dynamic application security testing.
# Scans relay HTTP endpoints and WebSocket for common vulnerabilities.
# Manual trigger, advisory (allow_failure).
dast:zap:
  stage: load
  needs:
    - job: build:release
      artifacts: true
      optional: true
    - job: test
      optional: true
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  before_script:
    - |
      # Use prebuilt binary from build:release if available, otherwise compile
      if [ ! -f "target/release/vauchi-relay" ]; then
        apt-get update -qq && apt-get install -y -qq curl gcc pkg-config libssl-dev
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        . "$HOME/.cargo/env"
        cargo build --release
      fi
  script:
    - |
      RELAY_LISTEN_ADDR=0.0.0.0:8080 \
      RELAY_REQUIRE_NOISE_ENCRYPTION=false \
      ./target/release/vauchi-relay &
      RELAY_PID=$!

      # Wait for relay to be ready (poll health endpoint)
      for i in $(seq 1 30); do
        curl -sf http://127.0.0.1:8080/health && break
        sleep 0.5
      done

      # Verify relay is running
      curl -sf http://127.0.0.1:8080/health || { echo "Relay failed to start"; kill $RELAY_PID; exit 1; }

      # ZAP baseline scan against HTTP endpoints
      zap-baseline.py -t http://127.0.0.1:8080 -r zap-report.html -J zap-report.json

      kill $RELAY_PID 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  allow_failure: true
  artifacts:
    paths:
      - zap-report.html
      - zap-report.json
    expire_in: 1 week
    when: always

# ============================================================
# Build Stage
# ============================================================

build:release:
  extends: [.linux-runner, .timeout-standard]
  stage: build
  needs:
    - job: test
      optional: true
    - job: lint:format
      optional: true
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/vauchi-relay
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

build:docker:
  extends: .timeout-standard
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
      fi
    - docker build --cache-from $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
        docker push $CI_REGISTRY_IMAGE:latest
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  allow_failure: true

# ============================================================
# Deploy Stage (manual gate)
# ============================================================
#
# Zero-downtime deploy to production VPS via SSH + kamal-proxy.
# Pulls the CI-built image, starts a new container, health-checks it,
# then switches kamal-proxy traffic to the new backend.
#
# Required CI/CD variables (group or project level):
#   DEPLOY_SSH_PRIVATE_KEY  — Ed25519 private key for ssh vauchi@<host>
#   DEPLOY_HOST             — VPS hostname (e.g. bold-hopper-vps)
#   KAMAL_REGISTRY_PASSWORD — GitLab container registry token

deploy:production:
  stage: deploy
  image: alpine:latest
  needs:
    - job: build:docker
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      CONTAINER="vauchi-relay-${CI_COMMIT_SHORT_SHA}"
      SSH_TARGET="${DEPLOY_USER:-vauchi}@${DEPLOY_HOST}"
      echo "Deploying relay: $IMAGE"

      # Pull new image on server
      ssh "$SSH_TARGET" \
        "echo '${KAMAL_REGISTRY_PASSWORD}' | docker login -u gitlab-ci-token --password-stdin ${CI_REGISTRY} && docker pull ${IMAGE}"

      # Start new container
      ssh "$SSH_TARGET" "\
        docker run -d --name ${CONTAINER} \
          -e RELAY_LISTEN_ADDR=0.0.0.0:8080 \
          -e RELAY_METRICS_ADDR=0.0.0.0:8081 \
          -e RELAY_STORAGE_BACKEND=sqlite \
          -e RELAY_BLOB_TTL_SECS=7776000 \
          -e RELAY_RATE_LIMIT=60 \
          -e RELAY_MAX_CONNECTIONS=1000 \
          -e RUST_LOG=vauchi_relay=info \
          -e RELAY_TLS_VERIFIED=true \
          -v /opt/vauchi-data:/data \
          ${IMAGE}"

      # Health check new container
      ssh "$SSH_TARGET" "\
        IP=\$(docker inspect -f '{{.NetworkSettings.IPAddress}}' ${CONTAINER}) && \
        for i in \$(seq 1 30); do \
          curl -sf http://\${IP}:8080/health > /dev/null 2>&1 && break; \
          sleep 1; \
        done && \
        curl -sf http://\${IP}:8080/health || \
          { echo 'Health check failed — rolling back'; docker rm -f ${CONTAINER}; exit 1; }"

      # Switch traffic via kamal-proxy (zero-downtime)
      ssh "$SSH_TARGET" "\
        IP=\$(docker inspect -f '{{.NetworkSettings.IPAddress}}' ${CONTAINER}) && \
        docker exec kamal-proxy kamal-proxy deploy vauchi-relay \
          --target \${IP}:8080 \
          --host relay.vauchi.app \
          --health-check-path /health \
          --tls"

      # Clean up old containers (keep last 5)
      ssh "$SSH_TARGET" "\
        docker ps -a --filter 'name=vauchi-relay-' --format '{{.Names}}' | \
          grep -v '${CONTAINER}' | sort -r | tail -n +5 | \
          xargs -r docker rm -f 2>/dev/null || true"

      # Verify externally
      sleep 3
      STATUS=$(curl -sf -o /dev/null -w '%{http_code}' --max-time 10 "https://relay.vauchi.app/health" || echo "000")
      if [ "$STATUS" = "200" ]; then
        echo "Deployment verified — relay healthy"
      else
        echo "WARNING: External health check returned $STATUS"
        exit 1
      fi
  environment:
    name: production
    url: https://relay.vauchi.app
  when: manual
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
