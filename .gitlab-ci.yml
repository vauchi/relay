# GitLab CI for vauchi-relay
#
# WebSocket relay server
#
# Performance optimizations:
#   - Self-hosted runners: sccache, persistent caches, load-balanced
#   - Change-based rules: Jobs run only when relevant files change
#   - Timeouts: Prevent runaway jobs from blocking runners
#   - Interruptible: Auto-cancel on new commits (via templates)
#
# GitLab Ultimate Features:
#   - SAST: Static application security testing
#   - Dependency Scanning: Cargo.lock vulnerability scanning
#   - Secret Detection: Prevent credential leaks
#   - Container Scanning: Docker image vulnerability scanning

# Shared templates + GitLab Ultimate Templates
include:
  - project: 'vauchi/scripts'
    ref: main
    file:
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/security.yml'
      - '/ci-templates/coverage.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/release.yml'
      - '/ci-templates/test-quality.yml'
      - '/ci-templates/mutation.yml'
      - '/ci-templates/benchmark.yml'
  # Container scanning is relay-specific (not included in shared security.yml)
  - template: Security/Container-Scanning.gitlab-ci.yml

stages:
  - auto-tag
  - lint
  - test
  - security
  - mutation
  - build
  - load
  - scan
  - deploy


variables:
  # Container scanning for relay image
  # SAST/DS/SECRET_DETECTION excluded paths inherit from shared security.yml
  # (template defaults are more restrictive than relay's previous "target/" only)
  CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

# ============================================================
# Auto-Tag Stage
# ============================================================

# When Cargo.toml version is bumped and merged to main,
# automatically create a v{version} tag to trigger the release pipeline.
auto-tag:version:
  stage: auto-tag
  image: alpine:latest
  needs: []
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
  script:
    - apk add --no-cache git
    - |
      VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
      TAG="v${VERSION}"
      echo "Cargo.toml version: ${VERSION}"
      echo "Expected tag: ${TAG}"

      # Check if tag already exists
      if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
        echo "✓ Tag ${TAG} already exists — nothing to do"
        exit 0
      fi

      echo "Tag ${TAG} does not exist — creating it..."

      git config user.name "vauchi-gitlab-runner"
      git config user.email "noreply@vauchi.app"

      # Use project access token for push — CI_JOB_TOKEN cannot be used here
      # because pushes via CI_JOB_TOKEN do not trigger new pipelines, and the
      # tag push must trigger the release pipeline (build/docker stages).
      # PROJECT_ACCESS_TOKEN is set at group level in Settings > CI/CD > Variables.
      git remote set-url origin "https://vauchi-gitlab-runner:${PROJECT_ACCESS_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

      git tag -a "${TAG}" -m "Release ${TAG}"
      git push origin "${TAG}"
      echo "✓ Created and pushed tag ${TAG}"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Lint Stage — Preflight Gate (change-based)
# ============================================================
# Cheapest checks run first. Test + security jobs wait for these
# to pass before starting (PI-13 fail-fast DAG).

lint:format:
  extends: [.rust-runner-nocache, .lint-format, .validation-rust, .timeout-quick]
  needs: []

lint:clippy:
  extends: [.rust-runner-readonly, .lint-clippy, .validation-rust, .timeout-quick]
  needs: []

# ============================================================
# Test Stage (change-based, gated by lint)
# ============================================================

# MR: fast nextest (no coverage overhead)
test:
  extends: [.rust-runner, .validation-rust, .timeout-standard]
  stage: test
  needs:
    - job: lint:format
      optional: true
  script:
    - cargo nextest run --profile ci --all-targets
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

# Main: full coverage with llvm-cov
coverage:
  extends: [.coverage-job, .rust-runner, .timeout-long]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
  variables:
    COVERAGE_REPO_LABEL: "relay"
  rules:
    # Skip on triggered pipelines (downstream verification doesn't need coverage)
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ============================================================
# Mutation Stage (uses shared template from vauchi/scripts)
# ============================================================

mutation:nightly:
  extends: [.mutation-nightly, .rust-runner, .timeout-extended]
  variables:
    MUTATION_TIMEOUT_NIGHTLY: "120"

# ============================================================
# Benchmark Stage (uses shared template from vauchi/scripts)
# ============================================================

bench:save-baseline:
  extends: [.bench-save-baseline, .linux-runner, .timeout-standard, .bench-cache]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  variables:
    BENCH_TARGETS: "--bench storage_benchmarks --bench transport_benchmarks"

bench:compare:
  extends: [.bench-compare, .linux-runner, .timeout-standard, .bench-cache]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  variables:
    BENCH_TARGETS: "--bench storage_benchmarks --bench transport_benchmarks"

# ============================================================
# Fuzz Stage (nightly, libfuzzer via cargo-fuzz)
# ============================================================

fuzz:nightly:
  extends: [.rust-runner, .timeout-extended]
  stage: mutation
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $FUZZ_ENABLED == "true"
  allow_failure: true
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  script:
    - |
      command -v cargo-fuzz >/dev/null 2>&1 || cargo install cargo-fuzz --locked
      cd fuzz
      FUZZ_DURATION="${FUZZ_DURATION_SECS:-300}"
      FAILED=0
      for target in fuzz_federation_message fuzz_federation_padding \
                     fuzz_noise_handshake fuzz_noise_v2_detect \
                     fuzz_federation_url fuzz_validate_client_id; do
        echo "=== Fuzzing $target for ${FUZZ_DURATION}s ==="
        cargo fuzz run "$target" -- -max_total_time="$FUZZ_DURATION" 2>&1 || {
          echo "CRASH FOUND in $target"
          FAILED=$((FAILED + 1))
        }
      done
      echo "=== Fuzz Summary: Targets=6, Crashes=$FAILED ==="
      [ "$FAILED" -eq 0 ] || exit 1
  artifacts:
    paths:
      - fuzz/artifacts/
    expire_in: 1 month
    when: on_failure

# ============================================================
# Security Stage (change-based, gated by lint, parallel with test)
# ============================================================

# GitLab security templates configuration
# Override child analyzer jobs (not parent stubs) to add tags and rules

semgrep-sast:
  tags: [docker]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

secret_detection:
  tags: [docker]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

container_scanning:
  stage: scan
  needs: ["build:docker"]
  tags: [docker]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Rust-specific security (runs on dependency changes)
security:audit:
  extends: [.rust-runner-readonly, .security-audit, .validation-deps, .timeout-quick]
  needs: []
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v cargo-audit >/dev/null 2>&1 || cargo binstall cargo-audit --no-confirm 2>/dev/null || cargo install cargo-audit

# Full cargo-deny check: advisories, licenses, bans, sources
security:deny:
  extends: [.rust-runner-readonly, .security-deny, .timeout-quick]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v cargo-deny >/dev/null 2>&1 || cargo binstall cargo-deny --no-confirm 2>/dev/null || cargo install cargo-deny

# ============================================================
# Load Test Stage (PI-10)
# ============================================================

# k6 WebSocket load test — runs against a local relay instance.
# Thresholds: p95 connection < 500ms, throughput > 10 msg/s.
# Runs on nightly schedule and release tags (advisory).
load:k6:
  extends: [.linux-runner, .timeout-standard]
  stage: load
  needs:
    - job: build:release
      artifacts: true
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v k6 >/dev/null 2>&1 || { curl -fsSL https://github.com/grafana/k6/releases/download/v0.56.0/k6-v0.56.0-linux-amd64.tar.gz | tar xz --strip-components=1 -C /usr/local/bin k6-v0.56.0-linux-amd64/k6; }
  script:
    # Start relay in background with Noise encryption disabled for load testing
    - |
      RELAY_LISTEN_ADDR=127.0.0.1:8080 \
      RELAY_REQUIRE_NOISE_ENCRYPTION=false \
      RELAY_MAX_CONNECTIONS=500 \
      ./target/release/vauchi-relay &
      RELAY_PID=$!

      # Wait for relay to be ready (poll health endpoint)
      for i in $(seq 1 30); do
        curl -sf http://127.0.0.1:8080/health && break
        sleep 0.5
      done

      # Verify relay is healthy
      curl -sf http://127.0.0.1:8080/health || { echo "Relay failed to start"; kill $RELAY_PID; exit 1; }

      # Run k6 load test
      k6 run tests/load/relay-load-test.js || K6_EXIT=$?

      kill $RELAY_PID 2>/dev/null || true
      exit ${K6_EXIT:-0}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  allow_failure: true
  artifacts:
    paths:
      - summary.json
    expire_in: 1 week
    when: always

# ============================================================
# DAST Stage (PI-17) — ZAP scan for WebSocket attacks
# ============================================================

# OWASP ZAP dynamic application security testing.
# Scans relay HTTP endpoints and WebSocket for common vulnerabilities.
# Manual trigger, advisory (allow_failure).
dast:zap:
  stage: load
  tags: [docker]
  needs:
    - job: build:release
      artifacts: true
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  before_script: []
  script:
    - |
      RELAY_LISTEN_ADDR=0.0.0.0:8080 \
      RELAY_REQUIRE_NOISE_ENCRYPTION=false \
      ./target/release/vauchi-relay &
      RELAY_PID=$!

      # Wait for relay to be ready (poll health endpoint)
      for i in $(seq 1 30); do
        curl -sf http://127.0.0.1:8080/health && break
        sleep 0.5
      done

      # Verify relay is running
      curl -sf http://127.0.0.1:8080/health || { echo "Relay failed to start"; kill $RELAY_PID; exit 1; }

      # ZAP baseline scan against HTTP endpoints
      zap-baseline.py -t http://127.0.0.1:8080 -r zap-report.html -J zap-report.json

      kill $RELAY_PID 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  allow_failure: true
  artifacts:
    paths:
      - zap-report.html
      - zap-report.json
    expire_in: 1 week
    when: always

# ============================================================
# Build Stage
# ============================================================

build:release:
  extends: [.linux-runner, .timeout-standard]
  stage: build
  needs:
    - job: test
      optional: true
    - job: lint:format
      optional: true
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/vauchi-relay
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

build:docker:
  extends: .timeout-standard
  stage: build
  tags: [docker]
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
      fi
    - docker build --cache-from $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
        docker push $CI_REGISTRY_IMAGE:latest
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# Deploy Stage (manual gate)
# ============================================================
#
# Zero-downtime deploy to production VPS via SSH + kamal-proxy.
# Pulls the CI-built image, starts a new container, health-checks it,
# then switches kamal-proxy traffic to the new backend.
#
# Required CI/CD variables (group or project level):
#   DEPLOY_SSH_PRIVATE_KEY  — Ed25519 private key for ssh vauchi@<host>
#   DEPLOY_HOST             — VPS hostname (e.g. bold-hopper-vps)
#   KAMAL_REGISTRY_PASSWORD — GitLab container registry token

deploy:production:
  stage: deploy
  tags: [docker]
  image: alpine:latest
  needs:
    - job: build:docker
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      CONTAINER="vauchi-relay-${CI_COMMIT_SHORT_SHA}"
      SSH_TARGET="${DEPLOY_USER:-vauchi}@${DEPLOY_HOST}"
      echo "Deploying relay: $IMAGE"

      # Pull new image on server
      ssh "$SSH_TARGET" \
        "echo '${KAMAL_REGISTRY_PASSWORD}' | docker login -u gitlab-ci-token --password-stdin ${CI_REGISTRY} && docker pull ${IMAGE}"

      # Start new container
      ssh "$SSH_TARGET" "\
        docker run -d --name ${CONTAINER} \
          -e RELAY_LISTEN_ADDR=0.0.0.0:8080 \
          -e RELAY_METRICS_ADDR=0.0.0.0:8081 \
          -e RELAY_STORAGE_BACKEND=sqlite \
          -e RELAY_BLOB_TTL_SECS=7776000 \
          -e RELAY_RATE_LIMIT=60 \
          -e RELAY_MAX_CONNECTIONS=1000 \
          -e RUST_LOG=vauchi_relay=info \
          -e RELAY_TLS_VERIFIED=true \
          -v /opt/vauchi-data:/data \
          ${IMAGE}"

      # Health check new container
      ssh "$SSH_TARGET" "\
        IP=\$(docker inspect -f '{{.NetworkSettings.IPAddress}}' ${CONTAINER}) && \
        for i in \$(seq 1 30); do \
          curl -sf http://\${IP}:8080/health > /dev/null 2>&1 && break; \
          sleep 1; \
        done && \
        curl -sf http://\${IP}:8080/health || \
          { echo 'Health check failed — rolling back'; docker rm -f ${CONTAINER}; exit 1; }"

      # Switch traffic via kamal-proxy (zero-downtime)
      ssh "$SSH_TARGET" "\
        IP=\$(docker inspect -f '{{.NetworkSettings.IPAddress}}' ${CONTAINER}) && \
        docker exec kamal-proxy kamal-proxy deploy vauchi-relay \
          --target \${IP}:8080 \
          --host relay.vauchi.app \
          --health-check-path /health \
          --tls"

      # Clean up old containers (keep last 5)
      ssh "$SSH_TARGET" "\
        docker ps -a --filter 'name=vauchi-relay-' --format '{{.Names}}' | \
          grep -v '${CONTAINER}' | sort -r | tail -n +5 | \
          xargs -r docker rm -f 2>/dev/null || true"

      # Verify externally
      sleep 3
      STATUS=$(curl -sf -o /dev/null -w '%{http_code}' --max-time 10 "https://relay.vauchi.app/health" || echo "000")
      if [ "$STATUS" = "200" ]; then
        echo "Deployment verified — relay healthy"
      else
        echo "WARNING: External health check returned $STATUS"
        exit 1
      fi
  environment:
    name: production
    url: https://relay.vauchi.app
  when: manual
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
