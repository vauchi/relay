#
# ZAP baseline-scan rule configuration for vauchi-relay.
#
# Format per zap_common.py load_config(): tab-separated, three fields
# per non-comment line — <rule_id><TAB><WARN|FAIL|IGNORE|INFO><TAB><note>.
# The third field is required by the parser (split('\t', 2)); its
# contents are free text used as the action's rationale.
#
# -----------------------------------------------------------------
# 10049 — Cacheability (informational, risk=Info in ZAP for all three
# variants: Storable+Cacheable, Storable+Non-Cacheable, Non-Storable).
# We already send Cache-Control: no-store on every response (see
# security_headers_middleware in src/http.rs); the "Non-Storable
# Content" alert is just ZAP confirming that state. Nothing actionable.
10049	IGNORE	Cacheability alert is informational; Cache-Control: no-store is the correct posture.
