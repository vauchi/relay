#
# ZAP baseline-scan rule configuration for vauchi-relay.
#
# Format: <rule_id>  <action>   [url_regex]
# Action is one of: WARN | FAIL | IGNORE | INFO
# Default for baseline-scan is WARN for everything not listed.
#
# -----------------------------------------------------------------
# 10049  IGNORE   Cacheability
# -----------------------------------------------------------------
# Rule 10049 raises an alert on every cacheability state it observes
# (Storable and Cacheable, Storable but Non-Cacheable, Non-Storable).
# All three variants are risk = Info in ZAP — informational, not
# actionable. We already send Cache-Control: no-store on every
# response (see security_headers_middleware in src/http.rs), so the
# response is correctly non-storable. The alert is noise confirming
# state we already set intentionally.
10049  IGNORE
