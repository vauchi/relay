[package]
name = "vauchi-relay"
version = "0.3.3"
edition = "2024"
description = "Relay server for Vauchi - encrypted blob storage and forwarding"
license = "GPL-3.0-or-later"

[features]
default = []
# Profiling: install a tracing-flame layer at startup. Writes a `.folded`
# trace file to `$VAUCHI_FLAME_OUT` (default: `relay/artifacts/flame/`).
# Render with `inferno-flamegraph` or `just flame-render`.
flame = ["dep:tracing-flame"]

[dependencies]
# Async runtime (minimal features: excludes fs, process, io-std, parking_lot)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID for blob IDs
uuid = { version = "1.0", features = ["v4"] }

# Shared protocol message types
vauchi-protocol = { git = "https://gitlab.com/vauchi/core.git", branch = "main" }

# Hex encoding/decoding for key hashes
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Profiling layer (enabled via `flame` feature)
tracing-flame = { version = "0.2", optional = true }

# SQLite for persistent storage
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP server for health/metrics endpoints
axum = "0.7"

# Federation transport: serve/consume the axum router over the in-process
# mTLS stream (ADR-052). Already in the tree transitively via axum.
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# SHA-256 integrity hashing, Ed25519 signatures, HKDF (FIPS 140-3 Level 1)
aws-lc-rs = "1.16"

# Constant-time comparison for integrity hash verification (prevents timing attacks)
subtle = "2.6"

# Base64url encoding for relay public key distribution
base64 = "0.22"

# Zeroize key material on drop (R-M1)
zeroize = "1.8"

# OHTTP gateway (RFC 9458) — pure Rust, no NSS
ohttp = { version = "0.7", default-features = false, features = ["client", "server", "rust-hpke"] }

# Enable zeroize-on-drop for OHTTP X25519 private keys.
# The hpke crate (via ohttp) only enables x25519-dalek's `static_secrets`
# feature — NOT `zeroize`. Without this, OHTTP private key bytes linger in
# freed memory after key rotation. Cargo feature unification activates
# ZeroizeOnDrop for all StaticSecret instances in the dependency graph.
x25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }

# Non-poisoning Mutex/RwLock (prevents panic cascading from poisoned locks)
parking_lot = "0.12"

# Random number generation for exchange broker short codes
rand = "0.8"

# TLS for federation mTLS (mutual TLS between relays)
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2"

# tower::Service: drive the axum federation router from hyper's
# per-connection serve over the mTLS stream (ADR-052).
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tempfile = "3.0"
rcgen = "0.14.7"
proptest = "1"
rstest = "0.26"
criterion = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
# Used by the built-in process metrics collector to read /proc/self/stat.
libc = "0.2"

# Development profile: fast builds, backtraces work (matches core)
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Test profile: skip full debug info, reduce binary size ~60%
[profile.test]
debug = "line-tables-only"
split-debuginfo = "off"

[profile.release]
overflow-checks = true   # Catch integer overflows in production
lto = "thin"             # Link-time optimization (smaller binary)
panic = "abort"          # Abort on panic (no unwinding in production)
strip = true             # Strip symbols (smaller binary)
codegen-units = 1        # Single codegen unit (better optimization)

[[bench]]
name = "storage_benchmarks"
harness = false

[[bench]]
name = "transport_benchmarks"
harness = false

