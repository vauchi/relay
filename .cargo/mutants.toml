# cargo-mutants configuration for vauchi-relay
# See: https://mutants.rs/config-file.html

# flame.rs is compiled only with the `flame` profiling feature, which the
# mutation build does not enable: its mutants are never built, so every
# one of them reads as missed.
exclude_globs = ["src/flame.rs"]

# Mutants no test can catch.
#
# Each entry is a regex matched against cargo-mutants' textual mutant
# description (`path:LINE:COL: replace X with Y in fn`). Entries anchor on
# the function and operator, not the line, so they survive edits above
# them. Add one only with the reason it cannot be observed; a mutant a
# test could catch gets the test instead (vauchi/private#440).
exclude_re = [
    # Equivalent. With capacity_max_bytes == 0 the ratio on the next line
    # is 0/0 = NaN or n/0 = inf, and neither is below any threshold, so
    # the peer is refused with or without this guard. The guard stays
    # because it says so without leaning on float semantics.
    "replace > with >= in PeerRegistry::get_peer_with_capacity",

    # Log-only. The one comparison in run_gossip_task decides whether a
    # cleanup line is logged; the count it guards is asserted through
    # run_gossip_round's GossipRound.
    "replace > with (==|<|>=) in run_gossip_task",

    # Equivalent. handle_exchange_offer_logic takes one token from the
    # global offer bucket and one from the per-payload bucket of the same
    # limiter, so both have the same size and refill rate and the global
    # one always runs out first. With a constant hash every payload shares
    # one bucket, which empties in step with the global one: no request is
    # decided differently. (The per-payload limit itself adds nothing;
    # vauchi/private#471.)
    "replace rate_limit_hash -> u64 with (0|1)",

    # Boundary of a deliberately conservative size estimate. `>` and `>=`
    # differ only when the estimated page lands exactly on
    # MAX_FETCH_RESPONSE_BYTES; both keep the page within the budget, and
    # a test for it would pin the estimate's constants, not behaviour.
    "replace > with >= in handle_fetch_logic",

    # Log-only. `sent > 0` in check_and_offload decides whether the
    # "Offloaded N blobs" line is logged; the count itself is returned and
    # asserted.
    "replace > with (==|<|>=) in OffloadManager::check_and_offload",

    # Message-only. A frame of exactly the header length has an empty JSON
    # body and is rejected either way: as "Frame too short" with `<=`, as
    # a JSON parse error with `<`.
    "replace < with <= in decode_federation_message",

    # Equivalent on the test host. Each sysconf fallback (100 ticks per
    # second, 4096-byte pages) is taken only when sysconf fails, which it
    # does not, and equals what sysconf returns on x86_64 Linux: swapping
    # the branches yields the same number.
    "replace <= with > in (ticks_per_second|page_size)",
]
