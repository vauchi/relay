# OHTTP relay deployment — standalone three-container architecture
#
# This compose file is an ALTERNATIVE to the primary Kamal deployment.
# Use it for:
#   - Local development/testing of the OHTTP stack
#   - Deploying on a separate host (post-MVP, strongest IP separation)
#   - Environments without Kamal (bare Docker host)
#
# For production on bold-hopper-vps, use the Kamal accessory instead:
#   _private/infra/config/deploy.combined.yml (ohttp-relay accessory)
#   Design: _private/docs/designs/2026-03-25-kamal-ohttp-integration-design.md
#
# Client → Caddy (443, auto-TLS) → OHTTP Relay (8082) → Vauchi Relay (8080, internal only)
#
# Caddy handles TLS termination with automatic Let's Encrypt certificates.
# The OHTTP relay decapsulates OHTTP requests and forwards to the vauchi relay.
# The vauchi relay is on an internal-only network with no internet access.
#
# SECURITY NOTES:
# - Same-VPS root can inspect Docker bridge traffic (plain HTTP between containers).
#   Mitigate: deploy on separate hosts or add inter-container TLS.
# - HTTP auth model: mailbox tokens as implicit bearer auth for send/fetch.
#   Purge requires Ed25519 signature (same as the HTTP send/fetch path).
# - Replay mitigation: OHTTP layer prevents raw transport replay (fresh HPKE
#   context per request). Application-layer replay produces duplicate blobs
#   which clients deduplicate by blob_id.
# - KEY-01: ohttp crate's Server type does not zeroize private keys on drop.
#   Mitigated by server-side deployment (not user device). Track upstream.
#
# Usage:
#   # Set the domain before starting:
#   export RELAY_DOMAIN=relay.example.com
#   docker compose -f deploy/docker-compose.ohttp.yml up -d

services:
  caddy:
    image: caddy:2-alpine
    container_name: vauchi-caddy
    ports:
      - "80:80"     # HTTP → HTTPS redirect
      - "443:443"   # TLS-terminated HTTPS
    volumes:
      - ./Caddyfile.ohttp:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # Let's Encrypt certificates
      - caddy-config:/config
    environment:
      - RELAY_DOMAIN=${RELAY_DOMAIN:-localhost}
    networks:
      - external
    depends_on:
      - ohttp-relay
    restart: unless-stopped

  ohttp-relay:
    image: registry.gitlab.com/vauchi/ohttp-relay:latest
    container_name: vauchi-ohttp-relay
    # No external ports — only reachable via Caddy on the external network
    environment:
      - OHTTP_RELAY_LISTEN_ADDR=0.0.0.0:8082
      - OHTTP_RELAY_GATEWAY_URL=http://vauchi-relay:8080
      - RUST_LOG=vauchi_ohttp_relay=info
    networks:
      - external
      - internal
    restart: unless-stopped

  vauchi-relay:
    image: registry.gitlab.com/vauchi/relay:latest
    container_name: vauchi-relay
    # No external ports — only reachable via the internal network
    environment:
      - RELAY_LISTEN_ADDR=0.0.0.0:8080
      - RELAY_OHTTP_ENABLED=true
      - RELAY_OHTTP_KEY_ROTATION_HOURS=24
      - RELAY_HTTP_API_ENABLED=true
      - RELAY_MAX_CONNECTIONS=1000
      - RELAY_MAX_MESSAGE_SIZE=1048576
      - RELAY_STORAGE_BACKEND=sqlite
      - RELAY_DATA_DIR=/data
      - RELAY_BLOB_TTL_SECS=2592000
      - RELAY_RATE_LIMIT=60
      - RELAY_CLEANUP_INTERVAL=3600
      - RUST_LOG=vauchi_relay=info
    volumes:
      - relay-data:/data
    networks:
      - internal
    restart: unless-stopped
    # No in-container healthcheck — distroless has no shell/curl.

networks:
  internal:
    driver: bridge
    internal: true  # No internet access — containers only
  external:
    driver: bridge

volumes:
  relay-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
