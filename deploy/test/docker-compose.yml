# Test relay instance — test.relay.vauchi.app
# CI/e2e tests: 5min TTL, memory storage, auto-wipe

services:
  relay:
    image: registry.gitlab.com/vauchi/relay:latest
    ports:
      - "8080:8080"
    environment:
      - RELAY_LISTEN_ADDR=0.0.0.0:8080
      - RELAY_BLOB_TTL_SECONDS=300
      - RELAY_STORAGE_BACKEND=memory
      - RELAY_MAX_BLOBS_PER_RECIPIENT=1000
      - RELAY_LOG_LEVEL=debug
    restart: unless-stopped
    # No in-container healthcheck — distroless has no shell/curl.
    # Use external probes or wait-for-it scripts in CI.
