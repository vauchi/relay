[package]
name = "vauchi-relay-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.vauchi-relay]
path = ".."

# Prevent this from interfering with the parent workspace
[workspace]
members = ["."]

[[bin]]
name = "fuzz_federation_message"
path = "fuzz_targets/fuzz_federation_message.rs"
doc = false

[[bin]]
name = "fuzz_federation_padding"
path = "fuzz_targets/fuzz_federation_padding.rs"
doc = false

[[bin]]
name = "fuzz_federation_url"
path = "fuzz_targets/fuzz_federation_url.rs"
doc = false

[[bin]]
name = "fuzz_validate_client_id"
path = "fuzz_targets/fuzz_validate_client_id.rs"
doc = false
